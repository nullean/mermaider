<text x="370.55" y="272" text-anchor="middle" font-size="var(--fs-xs)" fill="var(--_text-muted)">Jul 8</text>
<line x1="545.09" y1="52" x2="545.09" y2="256" stroke="var(--_line)" stroke-width="0.5" opacity="0.35" />
<text x="545.09" y="272" text-anchor="middle" font-size="var(--fs-xs)" fill="var(--_text-muted)">Jul 9</text>
<text x="16" y="70.2" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">Render</text>

  <line x1="43.7" y1="244" x2="103.7" y2="244" stroke="#3B5B7D" stroke-width="1.75" />
  <rect x="43.7" y="204" width="60" height="48" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Cat" data-label="Cat">
  <rect x="123.7" y="204" width="60" height="48" rx="6" ry="6" fill="var(--bg)" />
  <path d="M123.7,236 L123.7,210 Q123.7,204 129.7,204 L177.7,204 Q183.7,204 183.7,210 L183.7,236 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="153.7" y="220" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Cat</text>
  <line x1="123.7" y1="236" x2="183.7" y2="236" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="123.7" y1="244" x2="183.7" y2="244" stroke="#3B5B7D" stroke-width="1.75" />
  <rect x="123.7" y="204" width="60" height="48" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
</svg>
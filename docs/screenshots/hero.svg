  <text x="76.55" y="119.3" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Layout</text>
</g>
<g class="node" data-id="C" data-label="Render SVG" data-shape="rectangle">
  <rect x="16" y="180.4" width="121.10199999999996" height="42.2" rx="8" ry="8" fill="url(#m41a2467f-ng-p0)" stroke="color-mix(in srgb, #7FE0FF 74%, var(--fg))" stroke-width="1.25" />
  <text x="76.55" y="201.5" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Render SVG</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 188" width="488" height="188" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="arch-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
    <polygon points="0 0, 12 6, 0 12" fill="var(--_arrow)" />
  </marker>
  <marker id="arch-arrow-start" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
    <polygon points="12 0, 0 6, 12 12" fill="var(--_arrow)" />
  </marker>
</defs>

<g class="arch-group" data-id="api">
  <rect x="32" y="32" width="132" height="124" rx="8" fill="var(--_group-fill)" stroke="var(--_group-stroke)" stroke-width="1.5" stroke-dasharray="6 4" />
  <path d="M53.86 48.34 a3.74 3.27 0 1 1 1.4 -4.21 a4.21 3.74 0 1 1 6.55 0 a3.27 2.81 0 1 1 1.87 4.21 z" fill="none" stroke="var(--_accent)" stroke-width="1.5" />
  <text x="78" y="46" text-anchor="start" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)">API</text>
</g>
<g class="arch-service" data-id="db">
  <rect x="200" y="32" width="120" height="72" rx="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.5" />
  <path d="M253.95 56.75 a4.4 3.85 0 1 1 1.65 -4.95 a4.95 4.4 0 1 1 7.7 0 a3.85 3.3 0 1 1 2.2 4.95 z" fill="none" stroke="var(--_accent)" stroke-width="1.5" />
  <text x="260" y="86" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Database</text>
</g>
<g class="arch-service" data-id="disk">
  <rect x="336" y="32" width="120" height="72" rx="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.5" />
  <path d="M389.95 56.75 a4.4 3.85 0 1 1 1.65 -4.95 a4.95 4.4 0 1 1 7.7 0 a3.85 3.3 0 1 1 2.2 4.95 z" fill="none" stroke="var(--_accent)" stroke-width="1.5" />
  <text x="396" y="86" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Disk</text>
</g>
<path d="M98 156 L98 94 L260 94 L260 32" fill="none" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#arch-arrow)" />
<path d="M98 156 L98 94 L396 94 L396 32" fill="none" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#arch-arrow)" />
</svg>
  <image x="790" y="104" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="812" y="182" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">OtelDemo</text>
</g>
<g class="architecture-service" data-id="es" data-icon="elastic:elasticsearch">
  <defs><linearGradient id="arch-grad-es" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#c99a00"/></linearGradient></defs>
  <rect x="52" y="86" width="80" height="80" rx="10" ry="10" fill="url(#arch-grad-es)" />

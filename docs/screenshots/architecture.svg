</g>
<g class="architecture-service" data-id="apm" data-icon="elastic:apm">
  <defs><linearGradient id="arch-grad-apm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9575"/><stop offset="1" stop-color="#d84315"/></linearGradient></defs>
  <rect x="232" y="86" width="80" height="80" rx="10" ry="10" fill="url(#arch-grad-apm)" />
  <image x="250" y="104" width="44" height="44" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+CjxwYXRoIGQ9Ik0yLjUgMTJoNGwyLTcgNCAxNCAyLTdoNS41IiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS13aWR0aD0iMiIgZmlsbD0ibm9uZSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPg==" />

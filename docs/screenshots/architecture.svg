    <image x="576" y="36" width="20" height="20" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+CjxwYXRoIGQ9Ik03IDE4YTQgNCAwIDAgMS0uNS03Ljk3QTUgNSAwIDAgMSAxNiA4LjVhNC41IDQuNSAwIDAgMSAxIDguOVYxOEg3eiIgZmlsbD0iIzY0NzQ4YiIvPgo8L3N2Zz4=" />
<text x="604" y="46" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">k8s</text>
</g>
<g class="architecture-group" data-id="ech">
  <rect x="24" y="24" width="316" height="350" rx="8" ry="8" fill="none" stroke="var(--_accent-stroke)" stroke-width="1.75" stroke-dasharray="6 4" />
    <image x="36" y="36" width="20" height="20" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+CjxwYXRoIGQ9Ik03IDE4YTQgNCAwIDAgMS0uNS03Ljk3QTUgNSAwIDAgMSAxNiA4LjVhNC41IDQuNSAwIDAgMSAxIDguOVYxOEg3eiIgZmlsbD0iIzY0NzQ4YiIvPgo8L3N2Zz4=" />
<text x="64" y="46" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">ECH</text>
</g>
<path class="architecture-edge" data-source="edot" data-target="otlp" d="M592,126 L458,126" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="otlp" data-target="apm" d="M446,126 L278,126 Q272,126 272,120 L272,86" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="oteldemo" data-target="edot" d="M772,126 L672,126" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="kbn" data-target="es" d="M232,306 L98,306 Q92,306 92,300 L92,86" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="apm" data-target="es" d="M232,126 L132,126" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<g class="architecture-service" data-id="edot" data-icon="server">
  <rect x="592" y="86" width="80" height="80" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <image x="610" y="104" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="632" y="182" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">EDOT</text>
</g>
<g class="architecture-service" data-id="oteldemo" data-icon="server">

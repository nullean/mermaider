<text x="1025" y="135" text-anchor="middle" dy="0.35em" font-size="14" fill="#ffffff">Sit down</text>
<line x1="150" y1="200" x2="1096" y2="200" stroke="#000000" stroke-width="4" marker-end="url(#journey-arrow)" />
</g>
</svg>
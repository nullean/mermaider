<svg xmlns="http://www.w3.org/2000/svg" id="still" viewBox="-6 16 212 160" width="44" height="33" role="img" aria-label="mermaider">
  <!-- The swimming fish from the landing page's nav lockup (docs/mermaider-landing.html), on its own for the docs
       header (branding.icon). Its SMIL animation is redone in CSS so prefers-reduced-motion can stop it. -->
  <style>
    .swim { animation: swim 3.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .blink { animation: blink 3.2s linear infinite; }
    @keyframes swim { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
    @keyframes blink { 0%, 70% { opacity: 1; } 78% { opacity: 0.1; } 88%, 100% { opacity: 1; } }
    /* Still under reduced motion, and when loaded as mermaider-fish-animated.svg#still (the docs header's
       reduced-motion source, for browsers whose image documents do not see the page's media). */
    @media (prefers-reduced-motion: reduce) { .swim, .blink { animation: none; } }
    #still:target .swim, #still:target .blink { animation: none; }
  </style>
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" id="mfa-stroke" x1="0" y1="0" x2="120" y2="96">
      <stop offset="0.46" stop-color="#7FE0FF"/><stop offset="0.54" stop-color="#D66FFF"/>
    </linearGradient>
    <radialGradient id="mfa-fill" cx="0.3" cy="0.16" r="1.1">
      <stop offset="0" stop-color="#2B3B4A"/><stop offset="0.5" stop-color="#1B2732"/><stop offset="1" stop-color="#121B24"/>
    </radialGradient>
    <clipPath id="mfa-clip"><path d="M178 84 C158 52 122 38 94 44 C78 48 62 60 56 76 L6 30 L18 96 L6 162 L56 116 C62 132 78 144 94 148 C122 155 158 140 178 108 L156 96 Z"/></clipPath>
  </defs>
  <g class="swim">
    <g clip-path="url(#mfa-clip)"><path d="M178 84 C158 52 122 38 94 44 C78 48 62 60 56 76 L6 30 L18 96 L6 162 L56 116 C62 132 78 144 94 148 C122 155 158 140 178 108 L156 96 Z" fill="url(#mfa-fill)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="21.7" stroke-linejoin="round" stroke-linecap="round"/></g>
    <path d="M178 84 C158 52 122 38 94 44 C78 48 62 60 56 76 L6 30 L18 96 L6 162 L56 116 C62 132 78 144 94 148 C122 155 158 140 178 108 L156 96 Z" fill="none" stroke="url(#mfa-stroke)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M42 96 H94" fill="none" stroke="#7FE0FF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="42" cy="96" r="10" fill="#7FE0FF"/>
    <circle cx="94" cy="96" r="12" fill="#B6D9FF"/>
    <circle class="blink" cx="136" cy="80" r="10" fill="#E19BFF"/>
  </g>
</svg>

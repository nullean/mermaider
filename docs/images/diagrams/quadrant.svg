<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 598 644" width="598" height="644" style="--bg:#FFFFFF;--fg:#27272A;--line:color-mix(in srgb, #64748b 74%, var(--fg));--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style>

<g class="diagram-title">
  <rect x="40" y="35.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="56" y="40" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Technical Skills Matrix</text>
</g>
<g class="quadrant" data-quadrant="2" data-label="Maintain">
  <rect x="78" y="84" width="238" height="238" rx="10" ry="10" fill="var(--_group-fill)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="94" y="106" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="var(--_text-muted)" dy="4.2">MAINTAIN</text>
</g>
<g class="quadrant" data-quadrant="1" data-label="Invest">
  <rect x="320" y="84" width="238" height="238" rx="10" ry="10" fill="color-mix(in srgb, var(--accent, var(--fg)) 6%, var(--bg))" stroke="color-mix(in srgb, var(--accent, var(--fg)) 42%, var(--bg))" stroke-width="1.25" />
  <text x="336" y="106" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="color-mix(in srgb, var(--accent, var(--fg)) 44%, var(--fg))" dy="4.2">INVEST</text>
</g>
<g class="quadrant" data-quadrant="3" data-label="Deprioritize">
  <rect x="78" y="326" width="238" height="238" rx="10" ry="10" fill="var(--_group-fill)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="94" y="348" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="var(--_text-muted)" dy="4.2">DEPRIORITIZE</text>
</g>
<g class="quadrant" data-quadrant="4" data-label="Phase Out">
  <rect x="320" y="326" width="238" height="238" rx="10" ry="10" fill="var(--_group-fill)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="336" y="348" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="var(--_text-muted)" dy="4.2">PHASE OUT</text>
</g>
<line x1="78" y1="582" x2="558" y2="582" stroke="var(--_line-soft)" stroke-width="1" />
<text x="78" y="600" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Beginner</text>
<text x="558" y="600" text-anchor="end" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Expert</text>
<g transform="translate(56 84) rotate(-90)"><text x="0" y="0" text-anchor="end" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">High Demand</text></g>
<g transform="translate(56 564) rotate(-90)"><text x="0" y="0" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Low Demand</text></g>
<g class="quadrant-point">
  <circle cx="270" cy="132" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="270" cy="132" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="286" y="132" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Kubernetes</text>
</g>
<g class="quadrant-point">
  <circle cx="414" cy="180" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="414" cy="180" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="430" y="180" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">React</text>
</g>
<g class="quadrant-point">
  <circle cx="222" cy="516" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="222" cy="516" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="238" y="516" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">COBOL</text>
</g>
<g class="quadrant-point">
  <circle cx="222" cy="228" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="222" cy="228" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="238" y="228" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Rust</text>
</g>
<g class="quadrant-point">
  <circle cx="462" cy="132" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="462" cy="132" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="478" y="132" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Python</text>
</g>
</svg>
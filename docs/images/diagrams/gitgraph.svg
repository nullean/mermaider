<path d="M147.2,52 L317.19999999999993,52 Q325.19999999999993,52 325.19999999999993,60 L325.19999999999993,156 Q325.19999999999993,164 333.19999999999993,164 L360.79999999999995,164" class="gitgraph-link" data-kind="fork" fill="none" stroke="color-mix(in srgb, #76b7b2 74%, var(--fg))" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

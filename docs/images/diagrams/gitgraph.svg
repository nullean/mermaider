<path d="M218.4,108 L289.6,108" class="gitgraph-link" data-kind="lane" fill="none" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M147.2,52 L432,52" class="gitgraph-link" data-kind="lane" fill="none" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M432,52 L503.2,52" class="gitgraph-link" data-kind="lane" fill="none" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M503.2,52 L574.4,52" class="gitgraph-link" data-kind="lane" fill="none" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<g class="commit" data-type="normal">
  <circle cx="147.2" cy="52" r="4.5" fill="color-mix(in srgb, #64748b 74%, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="147.2" y="70" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">init</text>

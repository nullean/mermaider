  <circle cx="360.79999999999995" cy="164" r="4.5" fill="color-mix(in srgb, #76b7b2 74%, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="360.8" y="182" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">b1</text>
</g>
<g class="commit" data-type="normal" data-merge="true">
  <circle cx="432" cy="52" r="5.5" fill="var(--bg)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="2.5" />
  <text x="432" y="70" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">merge-a</text>
</g>
<g class="commit" data-type="normal" data-merge="true">
  <circle cx="503.2" cy="52" r="5.5" fill="var(--bg)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="2.5" />
  <text x="503.2" y="70" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">merge-b</text>
</g>
<g class="commit" data-type="normal" data-head="true">
  <circle cx="574.3999999999999" cy="52" r="4.5" fill="color-mix(in srgb, #64748b 74%, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <circle cx="574.4" cy="52" r="10" fill="none" stroke="var(--accent, var(--fg))" stroke-width="1.5" />
  <text x="574.4" y="70" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">release</text>
  <rect x="555.2599999999999" y="24" width="38.28" height="16" rx="4" ry="4" fill="color-mix(in srgb, var(--accent, var(--fg)) 22%, var(--bg))" /><text x="574.4" y="32" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, var(--accent, var(--fg)) 44%, var(--fg))" dy="4.2">v2.0</text>

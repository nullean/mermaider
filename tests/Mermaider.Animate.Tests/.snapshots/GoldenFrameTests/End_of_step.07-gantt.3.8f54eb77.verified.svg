<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -46 1158.06 456" width="1158.0629090909092" height="456" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6"><desc>In 4 steps: 1. Design starts the release. 2. API and UI are built in parallel; the UI finishes early. 3. Testing is on the critical path. 4. Launch.</desc><style>

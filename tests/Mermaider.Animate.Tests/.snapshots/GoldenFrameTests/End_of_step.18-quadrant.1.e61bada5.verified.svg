<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -46 598 690" width="598" height="690" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6"><desc>Search is cheap and matters most.</desc><style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style><g><g>


<g class="diagram-title">
  <rect x="40" y="35.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="56" y="40" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Effort and impact</text>
</g>
<g class="quadrant" data-quadrant="2" data-label="Do first">
  <rect x="78" y="84" width="238" height="238" rx="10" ry="10" fill="var(--_group-fill)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="94" y="106" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="var(--_text-muted)" dy="4.2">DO FIRST</text>
</g>
<g class="quadrant" data-quadrant="1" data-label="Plan">
  <rect x="320" y="84" width="238" height="238" rx="10" ry="10" fill="color-mix(in srgb, var(--accent, var(--fg)) 6%, var(--bg))" stroke="color-mix(in srgb, var(--accent, var(--fg)) 42%, var(--bg))" stroke-width="1.25" />
  <text x="336" y="106" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="color-mix(in srgb, var(--accent, var(--fg)) 44%, var(--fg))" dy="4.2">PLAN</text>
</g>
<g class="quadrant" data-quadrant="3" data-label="Skip">
  <rect x="78" y="326" width="238" height="238" rx="10" ry="10" fill="var(--_group-fill)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="94" y="348" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="var(--_text-muted)" dy="4.2">SKIP</text>
</g>
<g class="quadrant" data-quadrant="4" data-label="Avoid">
  <rect x="320" y="326" width="238" height="238" rx="10" ry="10" fill="var(--_group-fill)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="336" y="348" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="var(--_text-muted)" dy="4.2">AVOID</text>
</g>
<line x1="78" y1="582" x2="558" y2="582" stroke="var(--_line-soft)" stroke-width="1" />
<text x="78" y="600" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Low effort</text>
<text x="558" y="600" text-anchor="end" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">High effort</text>
<g transform="translate(56 84) rotate(-90)"><text x="0" y="0" text-anchor="end" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">High impact</text></g>
<g transform="translate(56 564) rotate(-90)"><text x="0" y="0" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Low impact</text></g>
<g class="mae41d512c-a0" style="opacity:1;transform:translate(0px,0.73px) scale(1);transform-box:view-box;transform-origin:198px 156px"><g class="quadrant-point mae41d512c-a5" data-index="1" data-label="Search" data-x="0.25" data-y="0.85" style="opacity:1">
  <circle cx="198" cy="156" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="198" cy="156" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="214" y="156" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Search</text>
</g><g opacity="0" class="mae41d512c-a9" style="opacity:0"><g transform="translate(198 127)"><rect x="-36.6" y="-10" width="73.2" height="20" rx="10" fill="#59a14f" stroke="#59a14f" stroke-width="1.5" /><text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="650" fill="#fff">do first</text></g></g></g>
<g class="mae41d512c-a1" style="opacity:1;transform:translate(0px,0.73px) scale(1);transform-box:view-box;transform-origin:174px 420px"><g class="quadrant-point mae41d512c-a6" data-index="2" data-label="Dark mode" data-x="0.2" data-y="0.3" style="opacity:1">
  <circle cx="174" cy="420" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="174" cy="420" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="190" y="420" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Dark mode</text>
</g></g>
<g class="mae41d512c-a2" style="opacity:1;transform:translate(0px,0.73px) scale(1);transform-box:view-box;transform-origin:486px 204px"><g class="quadrant-point mae41d512c-a7" data-index="3" data-label="Rewrite" data-x="0.85" data-y="0.75" style="opacity:1">
  <circle cx="486" cy="204" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="486" cy="204" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="502" y="204" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Rewrite</text>
</g></g>
<g class="mae41d512c-a3" style="opacity:1;transform:translate(0px,0.73px) scale(1);transform-box:view-box;transform-origin:414px 468px"><g class="quadrant-point mae41d512c-a8" data-index="4" data-label="Export" data-x="0.7" data-y="0.2" style="opacity:1">
  <circle cx="414" cy="468" r="11" fill="color-mix(in srgb, var(--accent, var(--fg)) 26%, var(--bg))" fill-opacity="0.7" />
  <circle cx="414" cy="468" r="5.5" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" />
  <text x="430" y="468" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Export</text>
</g></g>
<g pointer-events="none" /></g><g opacity="0" aria-hidden="true" class="mae41d512c-a4" style="opacity:0;transform:translate(0px,6px) scale(1);transform-box:view-box;transform-origin:0px 0px"><text x="14" y="-21.5" font-size="15" font-weight="650" fill="var(--_text, var(--fg))">Search is cheap and matters most</text><path d="M14,-11 L584,-11" stroke="var(--accent, #3b82f6)" stroke-width="2" stroke-opacity="0.55" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" fill="none" class="mae41d512c-a10" style="stroke-dashoffset:1" /></g></g><defs /></svg>

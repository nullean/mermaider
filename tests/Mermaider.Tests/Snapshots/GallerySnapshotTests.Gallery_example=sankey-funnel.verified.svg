<path d="M 517.33 228.16 C 616.67 228.16 616.67 234.04 716 234.04 L 716 274.6 C 616.67 274.6 616.67 270.4 517.33 270.4 Z" fill="url(#sankey-grad-3)" stroke="none" />
<rect x="84" y="24" width="12" height="352" fill="#59a14f" stroke="none" rx="2" ry="2" />
<text x="76" y="200" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Visitors 1000</text>
<rect x="294.67" y="24" width="12" height="352" fill="#e15759" stroke="none" rx="2" ry="2" />
<text x="286.67" y="200" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Signups 1000</text>

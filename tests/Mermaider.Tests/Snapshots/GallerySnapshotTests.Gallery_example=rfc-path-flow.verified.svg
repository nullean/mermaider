<path class="edge" data-from="docSetNav" data-to="tocNodes" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M566.5,187 L566.5,227" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

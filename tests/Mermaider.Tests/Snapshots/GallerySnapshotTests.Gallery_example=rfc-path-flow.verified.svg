<path class="edge" data-from="tocNodes" data-to="siteNav" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M468,272 L468,286 Q468,292 462,292 L414,292 Q408,292 408,298 L408,312" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="siteNav" data-to="pathProvider" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M242.5,398.5 L242.5,438.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

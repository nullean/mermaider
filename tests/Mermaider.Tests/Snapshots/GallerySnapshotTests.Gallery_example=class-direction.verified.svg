<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672.2 168" width="672.2" height="168" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="cls-inherit" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-composition" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <marker id="cls-aggregation" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-lollipop" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse">
    <circle cx="6" cy="6" r="5" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
</defs>

<path class="class-relationship" data-from="Controller" data-to="Service" data-type="association" data-marker-at="to" d="M194.6,84 L254.6,84" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#cls-arrow)" />
<path class="class-relationship" data-from="Service" data-to="Repository" data-type="association" data-marker-at="to" d="M417.6,84 L477.6,84" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#cls-arrow)" />
<g class="class-node" data-id="Controller" data-label="Controller">
  <rect x="40" y="50" width="154.6" height="68" rx="6" ry="6" fill="var(--bg)" />
  <path d="M40,82 L40,56 Q40,50 46,50 L188.6,50 Q194.6,50 194.6,56 L194.6,82 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="117.3" y="66" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Controller</text>
  <line x1="40" y1="82" x2="194.6" y2="82" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="40" y1="90" x2="194.6" y2="90" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="86.6" y1="82" x2="86.6" y2="118" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="48" y="104" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="94.6" y="104" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">handle()</tspan></text>
  <rect x="40" y="50" width="154.6" height="68" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Service" data-label="Service">
  <rect x="254.6" y="50" width="163" height="68" rx="6" ry="6" fill="var(--bg)" />
  <path d="M254.6,82 L254.6,56 Q254.6,50 260.6,50 L411.6,50 Q417.6,50 417.6,56 L417.6,82 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="336.1" y="66" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Service</text>
  <line x1="254.6" y1="82" x2="417.6" y2="82" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="254.6" y1="90" x2="417.6" y2="90" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="301.20000000000005" y1="82" x2="301.20000000000005" y2="118" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="262.6" y="104" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="309.20000000000005" y="104" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">process()</tspan></text>
  <rect x="254.6" y="50" width="163" height="68" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Repository" data-label="Repository">
  <rect x="477.6" y="40" width="154.60000000000002" height="88" rx="6" ry="6" fill="var(--bg)" />
  <path d="M477.6,72 L477.6,46 Q477.6,40 483.6,40 L626.2,40 Q632.2,40 632.2,46 L632.2,72 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="554.9000000000001" y="56" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Repository</text>
  <line x1="477.6" y1="72" x2="632.2" y2="72" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="477.6" y1="104" x2="632.2" y2="104" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="477.6" y1="80" x2="632.2" y2="80" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="541" y1="72" x2="541" y2="128" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="485.6" y="94" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">Object</text><text class="mono" x="549" y="94" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">find()</tspan></text>
  <text class="mono" x="485.6" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="549" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">save()</tspan></text>
  <rect x="477.6" y="40" width="154.60000000000002" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
</svg>
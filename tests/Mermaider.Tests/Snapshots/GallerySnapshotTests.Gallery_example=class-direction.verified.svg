<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635.6 168" width="635.6" height="168" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="cls-inherit" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
  <marker id="cls-composition" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
  <marker id="cls-aggregation" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
  <marker id="cls-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
  <marker id="cls-lollipop" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse">
    <circle cx="6" cy="6" r="5" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
</defs>

<path class="class-relationship" data-from="Controller" data-to="Service" data-type="association" data-marker-at="to" d="M182.4,84 L242.4,84" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#cls-arrow)" />
<path class="class-relationship" data-from="Service" data-to="Repository" data-type="association" data-marker-at="to" d="M393.2,84 L453.2,84" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#cls-arrow)" />
<g class="class-node" data-id="Controller" data-label="Controller">
  <rect x="40" y="50" width="142.4" height="68" rx="6" ry="6" fill="var(--_node-fill)" stroke="none" />
  <rect x="40" y="50" width="142.4" height="32" rx="6" ry="6" fill="var(--_group-hdr)" stroke="none" />
  <rect x="40" y="56" width="142.4" height="26" fill="var(--_group-hdr)" stroke="none" />
  <text x="111.2" y="66" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Controller</text>
  <line x1="40" y1="82" x2="182.4" y2="82" stroke="var(--_line)" stroke-width="1.5" />
  <line x1="40" y1="90" x2="182.4" y2="90" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="48" y="104" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">handle()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="40" y="50" width="142.4" height="68" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Service" data-label="Service">
  <rect x="242.4" y="50" width="150.79999999999998" height="68" rx="6" ry="6" fill="var(--_node-fill)" stroke="none" />
  <rect x="242.4" y="50" width="150.79999999999998" height="32" rx="6" ry="6" fill="var(--_group-hdr)" stroke="none" />
  <rect x="242.4" y="56" width="150.79999999999998" height="26" fill="var(--_group-hdr)" stroke="none" />
  <text x="317.8" y="66" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Service</text>
  <line x1="242.4" y1="82" x2="393.2" y2="82" stroke="var(--_line)" stroke-width="1.5" />
  <line x1="242.4" y1="90" x2="393.2" y2="90" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="250.4" y="104" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">process()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="242.4" y="50" width="150.79999999999998" height="68" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Repository" data-label="Repository">
  <rect x="453.2" y="40" width="142.4" height="88" rx="6" ry="6" fill="var(--_node-fill)" stroke="none" />
  <rect x="453.2" y="40" width="142.4" height="32" rx="6" ry="6" fill="var(--_group-hdr)" stroke="none" />
  <rect x="453.2" y="46" width="142.4" height="26" fill="var(--_group-hdr)" stroke="none" />
  <text x="524.4" y="56" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Repository</text>
  <line x1="453.2" y1="72" x2="595.6" y2="72" stroke="var(--_line)" stroke-width="1.5" />
  <line x1="453.2" y1="80" x2="595.6" y2="80" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="461.2" y="94" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">find()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">Object</tspan></text>
  <text class="mono" x="461.2" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">save()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="453.2" y="40" width="142.4" height="88" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
</svg>
  <rect x="52.724416666666684" y="103.2" width="49.947999999999986" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="77.7" y="114" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">if n &gt; 0</text>
</g>
<g class="edge-label" data-from="isPositive" data-to="Negative" data-label="if n &lt; 0">
  <rect x="154.06558333333334" y="103.2" width="49.947999999999986" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="179.04" y="114" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">if n &lt; 0</text>
</g>
<g class="node" data-id="isPositive" data-label="" data-shape="diamond">
  <polygon points="128.369,70 144.369,86 128.369,102 112.369,86" fill="url(#md68a0f86-ng-a)" stroke="color-mix(in srgb, var(--accent, var(--fg)) 74%, var(--fg))" stroke-width="1.25" />
  <text x="128.37" y="86" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9"></text>
</g>

<path class="edge" data-from="isPositive" data-to="Negative" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="if n &lt; 0" d="M133.70233333333334,96.5 L133.70233333333334,106 Q133.70233333333334,114 141.70233333333334,114 L186.152,114 Q194.152,114 194.152,122 L194.152,193.85" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#md68a0f86-mk-arrow)" />

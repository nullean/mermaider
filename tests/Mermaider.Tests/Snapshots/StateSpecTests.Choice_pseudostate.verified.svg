  <rect x="16" y="193.85" width="93.172" height="42.2" rx="14" ry="14" fill="url(#md68a0f86-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
  <text x="62.59" y="214.95" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Positive</text>
</g>

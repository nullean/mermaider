  <rect x="145.172" y="193.85" width="97.96000000000001" height="42.2" rx="14" ry="14" fill="url(#md68a0f86-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
  <text x="194.15" y="214.95" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Negative</text>
</g>

<path class="edge" data-from="LB" data-to="A1" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M207.5,84.8 L207.5,196.8" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

  <text x="94.73599999999999" y="686.554" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Laptop</text>
</g>
<g class="node" data-id="E" data-label="iPhone" data-shape="rectangle">
  <rect x="185.47199999999998" y="664.154" width="109.472" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />

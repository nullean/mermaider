<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 143" width="1026" height="143" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
</defs>

<text x="513" y="24" text-anchor="middle" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)">UDP Header</text>
<rect x="1" y="51" width="507" height="32" fill="#e8f0fe" stroke="var(--_line)" stroke-width="1" />
<text x="254.5" y="67" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Source Port</text>
<text x="1" y="49" text-anchor="start" font-size="var(--fs-xs)" fill="var(--_text)">0</text>
<text x="508" y="49" text-anchor="end" font-size="var(--fs-xs)" fill="var(--_text)">15</text>
<rect x="513" y="51" width="507" height="32" fill="#fef3e8" stroke="var(--_line)" stroke-width="1" />
<text x="766.5" y="67" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Destination Port</text>
<text x="513" y="49" text-anchor="start" font-size="var(--fs-xs)" fill="var(--_text)">16</text>
<text x="1020" y="49" text-anchor="end" font-size="var(--fs-xs)" fill="var(--_text)">31</text>
<rect x="1" y="98" width="507" height="32" fill="#f0e8fe" stroke="var(--_line)" stroke-width="1" />
<text x="254.5" y="114" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Length</text>
<text x="1" y="96" text-anchor="start" font-size="var(--fs-xs)" fill="var(--_text)">32</text>
<text x="508" y="96" text-anchor="end" font-size="var(--fs-xs)" fill="var(--_text)">47</text>
<rect x="513" y="98" width="507" height="32" fill="#e8fef0" stroke="var(--_line)" stroke-width="1" />
<text x="766.5" y="114" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Checksum</text>
<text x="513" y="96" text-anchor="start" font-size="var(--fs-xs)" fill="var(--_text)">48</text>
<text x="1020" y="96" text-anchor="end" font-size="var(--fs-xs)" fill="var(--_text)">63</text>
</svg>
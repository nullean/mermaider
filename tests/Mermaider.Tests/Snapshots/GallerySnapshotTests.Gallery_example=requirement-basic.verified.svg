<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 249.83999999999997 372.2" width="249.83999999999997" height="372.2" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="req-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
    <polygon points="0 0, 12 6, 0 12" fill="var(--_line)" stroke="var(--_line)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>

<path class="req-relation" d="M124.91999999999999,110 L124.91999999999999,202.2" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#req-arrow)" />
<rect x="88.23711999999998" y="143.875" width="73.36576000000002" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
<text x="124.92" y="156.1" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">satisfies</text>
<g class="req-node" data-id="test_req">
  <rect x="24" y="202.2" width="201.84" height="146" rx="6" ry="6" fill="var(--bg)" />
  <path d="M24,258.2 L24,208.2 Q24,202.2 30,202.2 L219.83999999999997,202.2 Q225.83999999999997,202.2 225.83999999999997,208.2 L225.83999999999997,258.2 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />

  <text x="124.92" y="222.2" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="#3B5B7D">Requirement</text>
  <text x="124.92" y="242.2" text-anchor="middle" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)">test_req</text>
  <line x1="24" y1="258.2" x2="225.84" y2="258.2" stroke="#3B5B7D" stroke-width="1.75" />
  <text x="38" y="271.2" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Id</text>
  <text x="129.7" y="271.2" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">1</text>
  <line x1="24" y1="280.7" x2="225.84" y2="280.7" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text x="38" y="291.2" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Text</text>
  <text x="129.7" y="291.2" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">the test text.</text>
  <line x1="24" y1="300.7" x2="225.84" y2="300.7" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text x="38" y="311.2" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Risk</text>
  <text x="129.7" y="311.2" dy="0.35em" font-size="var(--fs-s)" fill="#D52629">High</text>
  <line x1="24" y1="320.7" x2="225.84" y2="320.7" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text x="38" y="331.2" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Verification</text>
  <text x="129.7" y="331.2" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Test</text>
  <line x1="122.7" y1="258.2" x2="122.7" y2="348.2" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <rect x="24" y="202.2" width="201.84" height="146" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="req-node" data-id="test_entity">
  <rect x="44.92" y="24" width="160" height="86" rx="6" ry="6" fill="var(--bg)" />
  <path d="M44.91999999999999,80 L44.91999999999999,30 Q44.91999999999999,24 50.91999999999999,24 L198.92,24 Q204.92,24 204.92,30 L204.92,80 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />

  <text x="124.92" y="44" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="#3B5B7D">Element</text>
  <text x="124.92" y="64" text-anchor="middle" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)">test_entity</text>
  <line x1="44.92" y1="80" x2="204.92" y2="80" stroke="#3B5B7D" stroke-width="1.75" />
  <text x="58.92" y="93" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Type</text>
  <text x="110.3" y="93" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">simulation</text>
  <line x1="103.3" y1="80" x2="103.3" y2="110" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <rect x="44.92" y="24" width="160" height="86" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
</svg>
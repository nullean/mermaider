<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 249.83999999999997 369.6" width="249.83999999999997" height="369.6" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<defs>
  <marker id="req-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
    <polygon points="0 0, 10 5, 0 10" fill="var(--_line)" stroke="var(--_line)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>

<path class="req-relation" d="M124.91999999999999,110 L124.91999999999999,199.6" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#req-arrow)" />
<rect x="90.91467999999999" y="144" width="68.01064" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line-soft)" stroke-width="1" />
<text x="124.92" y="154.8" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">satisfies</text>
<g class="req-node" data-id="test_req">
  <rect x="24" y="199.6" width="201.84" height="146" rx="8" ry="8" fill="var(--bg)" />
  <path d="M24,255.6 L24,207.6 Q24,199.6 32,199.6 L217.83999999999997,199.6 Q225.83999999999997,199.6 225.83999999999997,207.6 L225.83999999999997,255.6 Z" fill="color-mix(in srgb, #4e79a7 22%, var(--bg))" />

  <text x="124.92" y="219.6" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #4e79a7 74%, var(--fg))">Requirement</text>
  <text x="124.92" y="239.6" text-anchor="middle" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)">test_req</text>
  <line x1="24" y1="255.6" x2="225.84" y2="255.6" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="38" y="268.6" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Id</text>
  <text x="129.7" y="268.6" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">1</text>
  <line x1="24" y1="278.1" x2="225.84" y2="278.1" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <text x="38" y="288.6" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Text</text>
  <text x="129.7" y="288.6" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">the test text.</text>
  <line x1="24" y1="298.1" x2="225.84" y2="298.1" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <text x="38" y="308.6" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Risk</text>
  <text x="129.7" y="308.6" dy="0.35em" font-size="var(--fs-s)" fill="color-mix(in srgb, #e15759 74%, var(--fg))">High</text>
  <line x1="24" y1="318.1" x2="225.84" y2="318.1" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <text x="38" y="328.6" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Verification</text>
  <text x="129.7" y="328.6" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Test</text>
  <line x1="122.7" y1="255.6" x2="122.7" y2="345.6" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <rect x="24" y="199.6" width="201.84" height="146" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
</g>
<g class="req-node" data-id="test_entity">
  <rect x="44.92" y="24" width="160" height="86" rx="8" ry="8" fill="var(--bg)" />
  <path d="M44.91999999999999,80 L44.91999999999999,32 Q44.91999999999999,24 52.91999999999999,24 L196.92,24 Q204.92,24 204.92,32 L204.92,80 Z" fill="color-mix(in srgb, #4e79a7 22%, var(--bg))" />

  <text x="124.92" y="44" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #4e79a7 74%, var(--fg))">Element</text>
  <text x="124.92" y="64" text-anchor="middle" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)">test_entity</text>
  <line x1="44.92" y1="80" x2="204.92" y2="80" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="58.92" y="93" dy="0.35em" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)">Type</text>
  <text x="110.3" y="93" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">simulation</text>
  <line x1="103.3" y1="80" x2="103.3" y2="110" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <rect x="44.92" y="24" width="160" height="86" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 303 288" width="303" height="288" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="cls-inherit" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-composition" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <marker id="cls-aggregation" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-lollipop" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse">
    <circle cx="6" cy="6" r="5" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
</defs>

<g class="class-node" data-id="MyService" data-label="MyService">
  <rect x="40" y="40" width="223" height="208" rx="6" ry="6" fill="var(--bg)" />
  <path d="M40,72 L40,46 Q40,40 46,40 L257,40 Q263,40 263,46 L263,72 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="151.5" y="56" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">MyService</text>
  <line x1="40" y1="72" x2="263" y2="72" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="40" y1="96" x2="263" y2="96" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="116" x2="263" y2="116" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="136" x2="263" y2="136" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="184" x2="263" y2="184" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="204" x2="263" y2="204" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="224" x2="263" y2="224" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="160" x2="263" y2="160" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="103.4" y1="72" x2="103.4" y2="248" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="48" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="111.4" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">publicField</tspan></text><text class="mono" x="255" y="86" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <text class="mono" x="48" y="106" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">int</text><text class="mono" x="111.4" y="106" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">privateField</tspan></text><text class="mono" x="255" y="106" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">-</text>
  <text class="mono" x="48" y="126" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">bool</text><text class="mono" x="111.4" y="126" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">protectedField</tspan></text><text class="mono" x="255" y="126" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">#</text>
  <text class="mono" x="48" y="146" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">float</text><text class="mono" x="111.4" y="146" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">packageField</tspan></text><text class="mono" x="255" y="146" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">~</text>
  <text class="mono" x="48" y="174" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="111.4" y="174" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">getStatus()</tspan></text><text class="mono" x="255" y="174" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <text class="mono" x="48" y="194" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">bool</text><text class="mono" x="111.4" y="194" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">validate()</tspan></text><text class="mono" x="255" y="194" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">-</text>
  <text class="mono" x="48" y="214" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="111.4" y="214" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">reset()</tspan></text><text class="mono" x="255" y="214" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">#</text>
  <text class="mono" x="48" y="234" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="111.4" y="234" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">notify()</tspan></text><text class="mono" x="255" y="234" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">~</text>
  <rect x="40" y="40" width="223" height="208" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
</svg>
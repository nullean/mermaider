<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590.808 420" width="590.808" height="420" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="seq-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--_line)" />
  </marker>
  <marker id="seq-arrow-open" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_line)" stroke-width="2" />
  </marker>
</defs>

<line class="lifeline" data-actor="A" x1="211.00799999999998" y1="70" x2="211.00799999999998" y2="390" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="351.98400000000004" y1="70" x2="351.98400000000004" y2="390" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="A" data-to="B" data-label="Login request" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="211.00799999999998" y1="114" x2="351.98400000000004" y2="114" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#seq-arrow)" />
  <rect x="226.78251999999998" y="83.775" width="109.42696000000001" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="281.496" y="96" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Login request</text>
</g>
<g class="message" data-from="B" data-to="A" data-label="Auth token" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="351.98400000000004" y1="164" x2="211.00799999999998" y2="164" stroke="var(--_line)" stroke-width="2.25" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="238.00155999999998" y="133.775" width="86.98888000000002" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="281.496" y="146" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Auth token</text>
</g>
<g class="message" data-from="A" data-to="B" data-label="GET /data" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="211.00799999999998" y1="256" x2="351.98400000000004" y2="256" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#seq-arrow)" />
  <rect x="240.00495999999998" y="225.775" width="82.98208000000001" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="281.496" y="238" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">GET /data</text>
</g>
<g class="note" data-position="right" data-actors="B">
  <rect x="412.01599999999996" y="124" width="148.792" height="38" rx="6" ry="6" fill="var(--_accent-fill)" stroke="var(--_accent-stroke)" stroke-width="2" />
  <text x="480.412" y="143" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_accent-text)" dy="4.8999999999999995">Validate credentials</text>
</g>
<g class="note" data-position="over" data-actors="A,B">
  <rect x="146.064" y="174" width="269.952" height="38" rx="6" ry="6" fill="var(--_accent-fill)" stroke="var(--_accent-stroke)" stroke-width="2" />
  <text x="281.03999999999996" y="193" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_accent-text)" dy="4.8999999999999995">Subsequent requests use JWT</text>
</g>
<g class="note" data-position="left" data-actors="A">
  <rect x="30" y="266" width="120.064" height="38" rx="6" ry="6" fill="var(--_accent-fill)" stroke="var(--_accent-stroke)" stroke-width="2" />
  <text x="96.032" y="285" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_accent-text)" dy="4.8999999999999995">Display results</text>
</g>
<g class="actor" data-id="A" data-label="Frontend" data-type="participant">
  <rect x="160.06399999999996" y="30" width="101.888" height="40" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
  <text x="211.00799999999998" y="50" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Frontend</text>
</g>
<g class="actor" data-id="B" data-label="Backend" data-type="participant">
  <rect x="301.95200000000006" y="30" width="100.06400000000001" height="40" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
  <text x="351.98400000000004" y="50" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Backend</text>
</g>
<g class="actor" data-id="A" data-label="Frontend" data-type="participant">
  <rect x="160.06399999999996" y="350" width="101.888" height="40" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
  <text x="211.00799999999998" y="370" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Frontend</text>
</g>
<g class="actor" data-id="B" data-label="Backend" data-type="participant">
  <rect x="301.95200000000006" y="350" width="100.06400000000001" height="40" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
  <text x="351.98400000000004" y="370" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Backend</text>
</g>
</svg>
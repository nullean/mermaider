<g class="note">
  <rect x="30" y="300" width="125.06199999999998" height="38" rx="4" ry="4" fill="color-mix(in srgb, var(--accent, var(--fg)) 9%, var(--bg))" stroke="color-mix(in srgb, var(--accent, var(--fg)) 42%, var(--bg))" stroke-width="1" />
  <rect x="30" y="300" width="3" height="38" fill="var(--accent, var(--fg))" />
  <text x="94.03" y="319" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="color-mix(in srgb, var(--accent, var(--fg)) 44%, var(--fg))" dy="4.2">Display results</text>
</g>
</g>
<g class="actor" data-id="A" data-label="Frontend" data-type="participant">
  <rect x="165.06199999999998" y="30" width="93.152" height="40" rx="8" ry="8" fill="url(#m0c36b112-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
  <text x="211.64" y="50" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Frontend</text>
</g>

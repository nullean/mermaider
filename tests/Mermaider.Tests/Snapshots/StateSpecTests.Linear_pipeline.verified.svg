<path class="edge" data-from="Received" data-to="Validated" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="validate" d="M105.68,143.25 L105.68,177.7" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Validated" data-to="Enriched" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="enrich" d="M105.68,222.5 L105.68,256.95" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Enriched" data-to="Stored" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="persist" d="M105.68,301.75 L105.68,336.2" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Stored" data-to="Published" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="notify" d="M105.68,381 L105.68,415.45" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Published" data-to="_end" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M105.68,460.25 L105.68,494.7" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

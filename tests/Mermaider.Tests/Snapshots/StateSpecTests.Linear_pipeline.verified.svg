  <rect x="27.85600000000001" y="439.75" width="107.648" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="81.68" y="462.15" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Stored</text>
</g>
<g class="node" data-id="Published" data-label="Published" data-shape="rounded">
  <rect x="16" y="563" width="131.36" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="81.68" y="585.4" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Published</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="stateend">
  <circle cx="81.68" cy="649.8" r="10" fill="none" stroke="var(--_text)" stroke-width="4" />
<circle cx="81.68" cy="649.8" r="6" fill="var(--_text)" stroke="none" />
  
</g>
</svg>
  <text x="105.68" y="437.84999999999997" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Published</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="stateend">

  <text x="105.68" y="349.59999999999997" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Stored</text>
</g>
<g class="node" data-id="Published" data-label="Published" data-shape="rounded">
  <rect x="40" y="404.2" width="131.36" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />

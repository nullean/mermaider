  <rect x="49.00392" y="388.29999999999995" width="65.35216000000001" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="81.68" y="400.525" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">persist</text>
</g>
<g class="edge-label" data-from="Stored" data-to="Published" data-label="notify">
  <rect x="54.61344000000001" y="511.54999999999995" width="54.13312" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="81.68" y="523.775" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">notify</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="statestart">
  <circle cx="81.68" cy="28" r="10" fill="var(--_text)" stroke="none" />
  
</g>

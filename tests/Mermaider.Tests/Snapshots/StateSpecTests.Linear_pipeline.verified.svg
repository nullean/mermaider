<text x="105.68" y="382.2" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">notify</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="statestart">
  <circle cx="105.68" cy="52" r="10" fill="var(--_text)" stroke="none" />
  

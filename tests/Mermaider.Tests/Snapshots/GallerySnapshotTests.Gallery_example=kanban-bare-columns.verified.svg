<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568.8319148936171 204" width="568.8319148936171" height="204" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
</defs>

<g class="kanban-column">
<rect x="24" y="24" width="164.84" height="156" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 6%, var(--bg))" stroke="#4B74A0" stroke-width="1.75" />
<text x="36" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="#4B74A0">To Do</text>
<rect x="153.84" y="33" width="23" height="18" rx="7" ry="7" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
<text x="165.34" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="#4B74A0">2</text>
</g>
<g class="kanban-card">
<rect x="36" y="72" width="140.84" height="52" rx="6" ry="6" fill="var(--bg)" stroke="#4B74A0" stroke-width="1.75" />
<text x="48" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Implement</text>
<text x="48" y="111.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">feature</text>
</g>
<g class="kanban-card">
<rect x="36" y="134" width="140.84" height="34" rx="6" ry="6" fill="var(--bg)" stroke="#4B74A0" stroke-width="1.75" />
<text x="48" y="155.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Write unit tests</text>
</g>
<g class="kanban-column">
<rect x="204.84" y="24" width="160" height="156" rx="8" ry="8" fill="color-mix(in srgb, #f28e2b 6%, var(--bg))" stroke="#F18921" stroke-width="1.75" />
<text x="216.84" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="#F18921">In Review</text>
<rect x="334.16" y="33" width="18.68" height="18" rx="7" ry="7" fill="color-mix(in srgb, #f28e2b 24%, var(--bg))" />
<text x="343.5" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="#F18921">1</text>
</g>
<g class="kanban-card">
<rect x="216.84" y="72" width="136" height="34" rx="6" ry="6" fill="var(--bg)" stroke="#F18921" stroke-width="1.75" />
<text x="228.84" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">PR for auth flow</text>
</g>
<g class="kanban-column">
<rect x="380.84" y="24" width="163.99" height="156" rx="8" ry="8" fill="color-mix(in srgb, #76b7b2 6%, var(--bg))" stroke="#6FB3AE" stroke-width="1.75" />
<text x="392.84" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="#6FB3AE">Done</text>
<rect x="514.15" y="33" width="18.68" height="18" rx="7" ry="7" fill="color-mix(in srgb, #76b7b2 24%, var(--bg))" />
<text x="523.49" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="#6FB3AE">1</text>
</g>
<g class="kanban-card">
<rect x="392.84" y="72" width="139.99" height="34" rx="6" ry="6" fill="var(--bg)" stroke="#6FB3AE" stroke-width="1.75" />
<text x="404.84" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Deploy to staging</text>
</g>
</svg>
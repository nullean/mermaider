<rect x="36" y="134" width="140.84" height="34" rx="8" ry="8" fill="var(--bg)" stroke="color-mix(in srgb, #4e79a7 42%, var(--bg))" stroke-width="1.25" />
<text x="48" y="155.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Write unit tests</text>
</g>
<g class="kanban-column">
<rect x="204.84" y="24" width="160" height="156" rx="12" ry="12" fill="color-mix(in srgb, #f28e2b 6%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1.25" />
<text x="216.84" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="color-mix(in srgb, #f28e2b 42%, var(--bg))">In Review</text>
<rect x="334.16" y="33" width="18.68" height="18" rx="7" ry="7" fill="color-mix(in srgb, #f28e2b 22%, var(--bg))" />
<text x="343.5" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, #f28e2b 42%, var(--bg))">1</text>
</g>
<g class="kanban-card">
<rect x="216.84" y="72" width="136" height="34" rx="8" ry="8" fill="var(--bg)" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1.25" />
<text x="228.84" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">PR for auth flow</text>
</g>
<g class="kanban-column">
<rect x="380.84" y="24" width="163.99" height="156" rx="12" ry="12" fill="color-mix(in srgb, #76b7b2 6%, var(--bg))" stroke="color-mix(in srgb, #76b7b2 42%, var(--bg))" stroke-width="1.25" />
<text x="392.84" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="color-mix(in srgb, #76b7b2 42%, var(--bg))">Done</text>
<rect x="514.15" y="33" width="18.68" height="18" rx="7" ry="7" fill="color-mix(in srgb, #76b7b2 22%, var(--bg))" />
<text x="523.49" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, #76b7b2 42%, var(--bg))">1</text>
</g>
<g class="kanban-card">
<rect x="392.84" y="72" width="139.99" height="34" rx="8" ry="8" fill="var(--bg)" stroke="color-mix(in srgb, #76b7b2 42%, var(--bg))" stroke-width="1.25" />
<text x="404.84" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Deploy to staging</text>
</g>
</svg>
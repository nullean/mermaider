  <rect x="106.03200000000001" y="209.7" width="144.128" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="178.096" y="232.1" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Processing</text>
</g>
<g class="node" data-id="Success" data-label="Success" data-shape="rounded">
  <rect x="16" y="316.95" width="124.06400000000001" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="78.03200000000001" y="339.34999999999997" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Success</text>
</g>
<g class="node" data-id="Failed" data-label="Failed" data-shape="rounded">
  <rect x="226.16" y="316.95" width="104" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="278.15999999999997" y="339.34999999999997" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Failed</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="stateend">
  <circle cx="103.07999999999998" cy="436.2" r="10" fill="none" stroke="var(--_text)" stroke-width="4" />
<circle cx="103.07999999999998" cy="436.2" r="6" fill="var(--_text)" stroke="none" />
  
</g>

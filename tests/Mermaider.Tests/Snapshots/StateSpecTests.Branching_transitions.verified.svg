  <rect x="222.13208" y="289.275" width="55.73584000000002" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="250" y="301.5" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">error</text>
</g>
<g class="edge-label" data-from="Failed" data-to="Idle" data-label="retry">
  <rect x="238.7348" y="178.45000000000002" width="52.53040000000001" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="265" y="190.675" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">retry</text>
</g>
<g class="edge-label" data-from="Failed" data-to="_end2" data-label="abort">
  <rect x="225.93344" y="370.54999999999995" width="54.133120000000005" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="253" y="382.775" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">abort</text>
</g>

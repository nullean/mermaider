  <rect x="171.72799999999998" y="233.625" width="60.54400000000002" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="202" y="245.85" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">submit</text>
</g>
<g class="edge-label" data-from="Processing" data-to="Success" data-label="ok">
  <rect x="121.7484" y="337.775" width="36.50320000000001" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="140" y="350" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">ok</text>
</g>
<g class="edge-label" data-from="Processing" data-to="Failed" data-label="error">
  <rect x="227.63208" y="337.775" width="55.73584000000002" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="255.5" y="350" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">error</text>
</g>
<g class="edge-label" data-from="Failed" data-to="Idle" data-label="retry">
  <rect x="293.2348" y="295.25" width="52.53040000000001" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="319.5" y="307.475" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">retry</text>
</g>
<g class="edge-label" data-from="Failed" data-to="_end2" data-label="abort">
  <rect x="274.93344" y="441.15" width="54.133120000000005" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="302" y="453.375" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">abort</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="statestart">
  <circle cx="202.096" cy="52" r="10" fill="var(--_text)" stroke="none" />
  
</g>
<g class="node" data-id="Idle" data-label="Idle" data-shape="rounded">
  <rect x="160.12800000000001" y="142.45" width="83.93599999999999" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="202.096" y="164.85" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Idle</text>
</g>
<g class="node" data-id="Processing" data-label="Processing" data-shape="rounded">
  <rect x="130.032" y="265.7" width="144.128" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="202.096" y="288.09999999999997" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Processing</text>
</g>
<g class="node" data-id="Success" data-label="Success" data-shape="rounded">
  <rect x="40" y="388.95" width="124.06400000000001" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="102.03200000000001" y="411.34999999999997" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Success</text>
</g>
<g class="node" data-id="Failed" data-label="Failed" data-shape="rounded">
  <rect x="250.16" y="388.95" width="104" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="302.15999999999997" y="411.34999999999997" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Failed</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="stateend">
  <circle cx="127.07999999999998" cy="524.2" r="10" fill="none" stroke="var(--_text)" stroke-width="4" />
<circle cx="127.07999999999998" cy="524.2" r="6" fill="var(--_text)" stroke="none" />
  
</g>
<g class="node" data-id="_end2" data-label="" data-shape="stateend">
  <circle cx="277.11199999999997" cy="524.2" r="10" fill="none" stroke="var(--_text)" stroke-width="4" />

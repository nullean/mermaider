  <rect x="227.00599999999997" y="97.69999999999999" width="47.36400000000001" height="30.2" rx="10" ry="10" fill="var(--bg)" stroke="none" />
<text x="250.688" y="112.79999999999998" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Retry</text>
</g>

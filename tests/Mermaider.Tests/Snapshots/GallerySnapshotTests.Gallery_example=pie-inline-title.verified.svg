<text x="165.18" y="378.75" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)" dy="4.9">28.57%</text>
<path d="M 108.35 196.73 L 97.97 193.1" fill="none" stroke="var(--_line)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
<text x="86.64" y="189.14" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)" dy="4.9">17.86%</text>

<text x="181.14" y="94.64" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)" dy="4.9">10.71%</text>
<rect x="472" y="193" width="10" height="10" rx="3" ry="3" fill="#4e79a7" stroke="none" />
  <text x="490" y="198" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Pizza</text>
  <text x="536.81" y="198" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">42.86%</text>
<rect x="472" y="221" width="10" height="10" rx="3" ry="3" fill="#f28e2b" stroke="none" />
  <text x="490" y="226" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Sushi</text>
  <text x="536.81" y="226" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">28.57%</text>
<rect x="472" y="249" width="10" height="10" rx="3" ry="3" fill="#e15759" stroke="none" />
  <text x="490" y="254" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Tacos</text>
  <text x="541.6" y="254" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">17.86%</text>
<rect x="472" y="277" width="10" height="10" rx="3" ry="3" fill="#76b7b2" stroke="none" />
  <text x="490" y="282" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Salad</text>
  <text x="536.81" y="282" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">10.71%</text>
</svg>
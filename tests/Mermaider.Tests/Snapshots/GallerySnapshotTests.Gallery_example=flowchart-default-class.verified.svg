  <rect x="135.216" y="16" width="124.976" height="44.8" rx="6" ry="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="197.704" y="38.4" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="#1b5e20" dy="5.6">All nodes</text>
</g>

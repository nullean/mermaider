  <rect x="144.336" y="123.25" width="106.73599999999999" height="44.8" rx="6" ry="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="197.704" y="145.65" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="#1b5e20" dy="5.6">Get the</text>
</g>
<g class="node" data-id="C" data-label="Default style" data-shape="rectangle">
  <rect x="125.184" y="230.5" width="145.04000000000002" height="44.8" rx="6" ry="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="197.704" y="252.9" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="#1b5e20" dy="5.6">Default style</text>
</g>
<g class="node" data-id="D" data-label="Unless overridden" data-shape="diamond">
  <polygon points="197.704,337.75 294.848,434.894 197.704,532.038 100.56,434.894" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="197.704" y="434.894" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="#1b5e20" dy="5.6">Unless overridden</text>
</g>

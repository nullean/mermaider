</g>
<g class="node" data-id="F" data-label="Still default" data-shape="rectangle">
  <rect x="255.8" y="594.488" width="134.096" height="44.8" rx="6" ry="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="322.848" y="616.888" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="#1b5e20" dy="5.6">Still default</text>
</g>
</svg>
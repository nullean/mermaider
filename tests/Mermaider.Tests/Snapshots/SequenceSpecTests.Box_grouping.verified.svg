</g>
<text x="312.39" y="26" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, Yellow 44%, var(--fg))" dy="4.9">External</text>
<line class="lifeline" data-actor="A" x1="70" y1="86" x2="70" y2="274" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<line class="lifeline" data-actor="B" x1="210" y1="86" x2="210" y2="274" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<line class="lifeline" data-actor="C" x1="350" y1="86" x2="350" y2="274" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />

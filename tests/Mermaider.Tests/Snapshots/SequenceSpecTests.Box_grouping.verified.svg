</g>
<defs>
  <linearGradient id="m1814eb8b-cw-bx0-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="color-mix(in srgb, Purple 2.1%, var(--bg))" /><stop offset="0.55" stop-color="color-mix(in srgb, Purple 6%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, Purple 6%, var(--bg))" /></linearGradient>
  <linearGradient id="m1814eb8b-cw-bx1-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="color-mix(in srgb, Yellow 2.1%, var(--bg))" /><stop offset="0.55" stop-color="color-mix(in srgb, Yellow 6%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, Yellow 6%, var(--bg))" /></linearGradient>
  <linearGradient id="m1814eb8b-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #64748b 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #64748b 7%, var(--bg))" /></linearGradient>

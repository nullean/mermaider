<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 254" width="624" height="254" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<defs>
</defs>

<g class="kanban-column">
<rect x="24" y="24" width="280" height="206" rx="12" ry="12" fill="color-mix(in srgb, #4e79a7 6%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 42%, var(--bg))" stroke-width="1.25" />
<text x="36" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="color-mix(in srgb, #4e79a7 42%, var(--bg))">To Do</text>
<rect x="269" y="33" width="23" height="18" rx="7" ry="7" fill="color-mix(in srgb, #4e79a7 22%, var(--bg))" />
<text x="280.5" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, #4e79a7 42%, var(--bg))">2</text>
</g>
<g class="kanban-card">
<rect x="36" y="72" width="256" height="102" rx="8" ry="8" fill="var(--bg)" stroke="color-mix(in srgb, #4e79a7 42%, var(--bg))" stroke-width="1.25" />
<rect x="36" y="74" width="4" height="98" rx="8" ry="8" fill="#edc948" />
<text x="52" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Investigate why the nightly</text>
<text x="52" y="111.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">reconciliation job occasionally</text>
<text x="52" y="129.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">double counts refunds</text>
<text x="52" y="147.9" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)">OPS-2210</text>
<text x="52" y="161.9" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)">a.very.long.assignee.name</text>
</g>
<g class="kanban-card">
<rect x="36" y="184" width="256" height="34" rx="8" ry="8" fill="var(--bg)" stroke="color-mix(in srgb, #4e79a7 42%, var(--bg))" stroke-width="1.25" />
<text x="48" y="205.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Short</text>
</g>
<g class="kanban-column">
<rect x="320" y="24" width="280" height="206" rx="12" ry="12" fill="color-mix(in srgb, #f28e2b 6%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1.25" />
<text x="332" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="color-mix(in srgb, #f28e2b 42%, var(--bg))">Doing</text>
<rect x="569.32" y="33" width="18.68" height="18" rx="7" ry="7" fill="color-mix(in srgb, #f28e2b 22%, var(--bg))" />
<text x="578.66" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, #f28e2b 42%, var(--bg))">1</text>
</g>
<g class="kanban-card">
<rect x="332" y="72" width="256" height="88" rx="8" ry="8" fill="var(--bg)" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1.25" />
<text x="344" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Write the migration guide for the</text>
<text x="344" y="111.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">new permissions model and</text>
<text x="344" y="129.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">review it with support</text>
<text x="344" y="147.9" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)">dana</text>
</g>
</svg>
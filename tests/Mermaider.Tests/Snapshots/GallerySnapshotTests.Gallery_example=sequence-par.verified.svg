<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 510" width="420" height="510" style="--bg:#FFFFFF;--fg:#27272A;--accent:#5b5fb0">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<g class="block" data-type="par" data-label="this happens in parallel">
  <rect x="30" y="102" width="360" height="164" rx="10" ry="10" fill="color-mix(in srgb, #f28e2b 6%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1.25" />
  <path d="M30,124 L30,112 Q30,102 40,102 L71.96,102 L71.96,124 Z" fill="color-mix(in srgb, #f28e2b 22%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1.25" />
  <text x="50.98" y="113" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, #f28e2b 44%, var(--fg))" dy="4.2">par</text>
  <text x="210" y="113" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #f28e2b 44%, var(--fg))" dy="4.9">this happens in parallel</text>
  <line x1="30" y1="208" x2="390" y2="208" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1.25" stroke-dasharray="5 4" />
</g>
<line class="lifeline" data-actor="Alice" x1="70" y1="70" x2="70" y2="440" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<line class="lifeline" data-actor="Bob" x1="210" y1="70" x2="210" y2="440" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<line class="lifeline" data-actor="John" x1="350" y1="70" x2="350" y2="440" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<g class="message" data-from="Alice" data-to="Bob" data-label="Parallel message 1" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="160" x2="210" y2="160" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m6dc990bb-mk-arrow)" />
  <rect x="81.852" y="135.2" width="116.29599999999999" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="140" y="146" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Parallel message 1</text>
</g>
<g class="message" data-from="Alice" data-to="John" data-label="Parallel message 2" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="246" x2="350" y2="246" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m6dc990bb-mk-arrow)" />
  <rect x="149.8" y="221.2" width="120.4" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="210" y="232" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Parallel message 2</text>
</g>
<g class="message" data-from="Bob" data-to="Alice" data-label="Response 1" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="296" x2="70" y2="296" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m6dc990bb-mk-arrow)" />
  <rect x="100.662" y="271.2" width="78.676" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="140" y="282" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Response 1</text>
</g>
<g class="message" data-from="John" data-to="Alice" data-label="Response 2" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="346" x2="70" y2="346" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m6dc990bb-mk-arrow)" />
  <rect x="168.61" y="321.2" width="82.77999999999999" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="210" y="332" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Response 2</text>
</g>
<g class="actor" data-id="Alice" data-label="Alice" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="8" ry="8" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="70" y="50" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Alice</text>
</g>
<g class="actor" data-id="Bob" data-label="Bob" data-type="participant">
  <rect x="170" y="30" width="80" height="40" rx="8" ry="8" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="210" y="50" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Bob</text>
</g>
<g class="actor" data-id="John" data-label="John" data-type="participant">
  <rect x="310" y="30" width="80" height="40" rx="8" ry="8" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="350" y="50" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">John</text>
</g>
<g class="actor actor-bottom" data-id="Alice" data-label="Alice" data-type="participant">
  <rect x="30" y="440" width="80" height="40" rx="8" ry="8" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="70" y="460" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Alice</text>
</g>
<g class="actor actor-bottom" data-id="Bob" data-label="Bob" data-type="participant">
  <rect x="170" y="440" width="80" height="40" rx="8" ry="8" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="210" y="460" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Bob</text>
</g>
<g class="actor actor-bottom" data-id="John" data-label="John" data-type="participant">
  <rect x="310" y="440" width="80" height="40" rx="8" ry="8" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="350" y="460" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">John</text>
</g>
<defs>
  <linearGradient id="m6dc990bb-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #4e79a7 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #4e79a7 7%, var(--bg))" /></linearGradient>
  <marker id="m6dc990bb-mk-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="10" refY="6" orient="auto">
    <polygon points="0,1.5 10,6 0,10.5" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>
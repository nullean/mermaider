<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 246" width="872" height="246" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<defs>
  <marker id="timeline-arrow" refX="6" refY="3" markerWidth="8" markerHeight="6" orient="auto">
    <path d="M 0,0 V 6 L8,3 Z" fill="var(--_line)" />
  </marker>
</defs>

<text x="436" y="28" text-anchor="middle" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)">Product Roadmap</text>
<line x1="130" y1="88" x2="130" y2="224" stroke="color-mix(in srgb, #4e79a7 45%, var(--bg))" stroke-width="1.5" stroke-dasharray="4 4" />
<line x1="334" y1="88" x2="334" y2="224" stroke="color-mix(in srgb, #f28e2b 45%, var(--bg))" stroke-width="1.5" stroke-dasharray="4 4" />
<line x1="538" y1="88" x2="538" y2="224" stroke="color-mix(in srgb, #76b7b2 45%, var(--bg))" stroke-width="1.5" stroke-dasharray="4 4" />
<line x1="742" y1="88" x2="742" y2="224" stroke="color-mix(in srgb, #b07aa1 45%, var(--bg))" stroke-width="1.5" stroke-dasharray="4 4" />
<line x1="28" y1="116" x2="864" y2="116" stroke="var(--_line)" stroke-width="3" marker-end="url(#timeline-arrow)" />
<rect x="40" y="52" width="180" height="36" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 22%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
<text x="130" y="70" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">Q1 2025</text>
<circle cx="130" cy="116" r="6" fill="color-mix(in srgb, #4e79a7 22%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
<rect x="50" y="142" width="160" height="28" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
<text x="130" y="156" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Alpha Release</text>
<rect x="244" y="52" width="180" height="36" rx="8" ry="8" fill="color-mix(in srgb, #f28e2b 22%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" />
<text x="334" y="70" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">Q2 2025</text>
<circle cx="334" cy="116" r="6" fill="color-mix(in srgb, #f28e2b 22%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" />
<rect x="254" y="142" width="160" height="28" rx="8" ry="8" fill="color-mix(in srgb, #f28e2b 11%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" />
<text x="334" y="156" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Beta Launch</text>
<rect x="254" y="176" width="160" height="28" rx="8" ry="8" fill="color-mix(in srgb, #f28e2b 11%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" />
<text x="334" y="190" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Partner Onboarding</text>
<rect x="448" y="52" width="180" height="36" rx="8" ry="8" fill="color-mix(in srgb, #76b7b2 22%, var(--bg))" stroke="color-mix(in srgb, #76b7b2 74%, var(--fg))" stroke-width="1.25" />
<text x="538" y="70" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">Q3 2025</text>
<circle cx="538" cy="116" r="6" fill="color-mix(in srgb, #76b7b2 22%, var(--bg))" stroke="color-mix(in srgb, #76b7b2 74%, var(--fg))" stroke-width="1.25" />
<rect x="458" y="142" width="160" height="28" rx="8" ry="8" fill="color-mix(in srgb, #76b7b2 11%, var(--bg))" stroke="color-mix(in srgb, #76b7b2 74%, var(--fg))" stroke-width="1.25" />
<text x="538" y="156" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">GA Release</text>
<rect x="652" y="52" width="180" height="36" rx="8" ry="8" fill="color-mix(in srgb, #b07aa1 22%, var(--bg))" stroke="color-mix(in srgb, #b07aa1 74%, var(--fg))" stroke-width="1.25" />
<text x="742" y="70" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">Q4 2025</text>
<circle cx="742" cy="116" r="6" fill="color-mix(in srgb, #b07aa1 22%, var(--bg))" stroke="color-mix(in srgb, #b07aa1 74%, var(--fg))" stroke-width="1.25" />
<rect x="662" y="142" width="160" height="28" rx="8" ry="8" fill="color-mix(in srgb, #b07aa1 11%, var(--bg))" stroke="color-mix(in srgb, #b07aa1 74%, var(--fg))" stroke-width="1.25" />
<text x="742" y="156" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Enterprise Features</text>
</svg>
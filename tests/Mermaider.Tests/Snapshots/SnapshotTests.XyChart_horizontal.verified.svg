<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<g class="diagram-title">
  <rect x="40" y="35.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="56" y="40" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Throughput</text>
</g>
<g class="xy-grid">
  <line x1="100" y1="92" x2="100" y2="416" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="100" y="436" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">0</text>
  <line x1="224" y1="92" x2="224" y2="416" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="224" y="436" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">20</text>
  <line x1="348" y1="92" x2="348" y2="416" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="348" y="436" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">40</text>
  <line x1="472" y1="92" x2="472" y2="416" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="472" y="436" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">60</text>
  <line x1="596" y1="92" x2="596" y2="416" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="596" y="436" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">80</text>
  <line x1="720" y1="92" x2="720" y2="416" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="720" y="436" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">100</text>
  <text x="88" y="146" text-anchor="end" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">alpha</text>
  <text x="88" y="254" text-anchor="end" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">beta</text>
  <text x="88" y="362" text-anchor="end" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">gamma</text>
</g>
<text x="410" y="460" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">req/s</text>
<g class="xy-bars" data-series="0">
  <path d="M 100 114.68 L 281 114.68 Q 286 114.68 286 119.68 L 286 172.32 Q 286 177.32 281 177.32 L 100 177.32 Z" fill="url(#ma2e31288-bg-d0)" />
  <path d="M 100 222.68 L 467 222.68 Q 472 222.68 472 227.68 L 472 280.32 Q 472 285.32 467 285.32 L 100 285.32 Z" fill="url(#ma2e31288-bg-d0)" />
  <path d="M 100 330.68 L 653 330.68 Q 658 330.68 658 335.68 L 658 388.32 Q 658 393.32 653 393.32 L 100 393.32 Z" fill="url(#ma2e31288-bg-d0)" />
</g>
<line x1="100" y1="92" x2="100" y2="416" stroke="var(--_line)" stroke-width="1.25" />
<defs>
  <linearGradient id="ma2e31288-bg-d0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4e79a7" /><stop offset="1" stop-color="color-mix(in srgb, #4e79a7 62%, var(--bg))" /></linearGradient>
</defs>
</svg>
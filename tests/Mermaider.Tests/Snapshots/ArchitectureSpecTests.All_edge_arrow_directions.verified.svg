<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 128" width="704" height="128" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<defs>
  <marker id="arch-arrow-end" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
    <polygon points="0 0, 10 5, 0 10" fill="var(--_line)" />
  </marker>
  <marker id="arch-arrow-start" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
    <polygon points="10 0, 0 5, 10 10" fill="var(--_line)" />
  </marker>
</defs>

<path class="architecture-edge" data-source="a" data-target="b" d="M104,64 L216,64" fill="none" stroke="var(--_line)" stroke-width="1.5" />
<path class="architecture-edge" data-source="b" data-target="c" d="M296,64 L408,64" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#arch-arrow-end)" />
<path class="architecture-edge" data-source="c" data-target="d" d="M488,64 L600,64" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-start="url(#arch-arrow-start)" />
<g class="architecture-service" data-id="a" data-icon="server">
  <rect x="24" y="24" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <image x="42" y="42" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="64" y="120" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">A</text>
</g>
<g class="architecture-service" data-id="b" data-icon="server">
  <rect x="216" y="24" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <image x="234" y="42" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="256" y="120" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">B</text>
</g>
<g class="architecture-service" data-id="c" data-icon="server">
  <rect x="408" y="24" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <image x="426" y="42" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="448" y="120" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">C</text>
</g>
<g class="architecture-service" data-id="d" data-icon="server">
  <rect x="600" y="24" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <image x="618" y="42" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="640" y="120" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">D</text>
</g>
</svg>
<text x="840" y="106" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)">2009</text>
<rect x="770" y="150" width="140" height="28" rx="6" ry="6" fill="#4e79a7" opacity="0.15" />
<text x="840" y="164" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Go</text>
<circle cx="1020" cy="120" r="8" fill="#4e79a7" stroke="var(--bg)" stroke-width="2" />
<text x="1020" y="106" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)">2015</text>
<rect x="950" y="150" width="140" height="28" rx="6" ry="6" fill="#4e79a7" opacity="0.15" />
<text x="1020" y="164" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Rust</text>
<circle cx="1200" cy="120" r="8" fill="#4e79a7" stroke="var(--bg)" stroke-width="2" />
<text x="1200" y="106" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)">2016</text>
<rect x="1130" y="150" width="140" height="28" rx="6" ry="6" fill="#4e79a7" opacity="0.15" />
<text x="1200" y="164" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">.NET Core</text>
<line x1="110" y1="120" x2="1210" y2="120" stroke="var(--_line)" stroke-width="2" />
</svg>
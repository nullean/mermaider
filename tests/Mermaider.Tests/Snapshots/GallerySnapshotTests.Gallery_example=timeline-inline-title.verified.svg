<text x="1354" y="178" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">.NET Core</text>
<line x1="120" y1="120" x2="1364" y2="120" stroke="var(--_line)" stroke-width="2" />

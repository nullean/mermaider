<text x="660" y="106" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)">1995</text>
<rect x="590" y="150" width="140" height="28" rx="6" ry="6" fill="#4e79a7" opacity="0.15" />
<text x="660" y="164" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Java</text>
<rect x="590" y="184" width="140" height="28" rx="6" ry="6" fill="#4e79a7" opacity="0.15" />
<text x="660" y="198" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">JavaScript</text>

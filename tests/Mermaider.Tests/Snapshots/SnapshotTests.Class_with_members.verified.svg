  <line x1="40" y1="112" x2="204.2" y2="112" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="160" x2="204.2" y2="160" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="136" x2="204.2" y2="136" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1.25" />
  <line x1="103.4" y1="88" x2="103.4" y2="184" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <text class="mono" x="48" y="102" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="111.4" y="102" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">name</tspan></text><text class="mono" x="196.2" y="102" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #86bcb6 74%, var(--fg))">+</text>
  <text class="mono" x="48" y="122" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">int</text><text class="mono" x="111.4" y="122" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">age</tspan></text><text class="mono" x="196.2" y="122" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #86bcb6 74%, var(--fg))">+</text>
  <text class="mono" x="48" y="150" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="111.4" y="150" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">eat()</tspan></text><text class="mono" x="196.2" y="150" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #86bcb6 74%, var(--fg))">+</text>
  <text class="mono" x="48" y="170" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="111.4" y="170" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">sleep()</tspan></text><text class="mono" x="196.2" y="170" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #86bcb6 74%, var(--fg))">+</text>
  <rect x="40" y="40" width="164.2" height="144" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1.25" />
</g>
<g class="class-node" data-id="Dog" data-label="Dog">
  <rect x="44.19999999999999" y="244" width="155.8" height="88" rx="8" ry="8" fill="var(--bg)" />
  <path d="M44.19999999999999,276 L44.19999999999999,252 Q44.19999999999999,244 52.19999999999999,244 L192,244 Q200,244 200,252 L200,276 Z" fill="color-mix(in srgb, #4e79a7 22%, var(--bg))" />
  <text x="122.1" y="260" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)" dy="4.8999999999999995">Dog</text>
  <line x1="44.19999999999999" y1="276" x2="200" y2="276" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <line x1="44.19999999999999" y1="304" x2="200" y2="304" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <line x1="107.6" y1="276" x2="107.6" y2="332" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <text class="mono" x="52.19999999999999" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="115.6" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">breed</tspan></text><text class="mono" x="192" y="290" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #4e79a7 74%, var(--fg))">+</text>
  <text class="mono" x="52.19999999999999" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="115.6" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">bark()</tspan></text><text class="mono" x="192" y="318" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #4e79a7 74%, var(--fg))">+</text>
  <rect x="44.19999999999999" y="244" width="155.8" height="88" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />

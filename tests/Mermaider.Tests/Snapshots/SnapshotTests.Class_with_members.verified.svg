<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 243 372" width="243" height="372" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="cls-inherit" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-composition" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <marker id="cls-aggregation" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-lollipop" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse">
    <circle cx="6" cy="6" r="5" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
</defs>

<path class="class-relationship" data-from="Animal" data-to="Dog" data-type="inheritance" data-marker-at="from" d="M121.5,184 L121.5,244" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-start="url(#cls-inherit)" />
<g class="class-node" data-id="Animal" data-label="Animal" data-annotation="abstract">
  <rect x="40" y="40" width="163" height="144" rx="6" ry="6" fill="var(--bg)" />
  <path d="M40,88 L40,46 Q40,40 46,40 L197,40 Q203,40 203,46 L203,88 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="121.5" y="52" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="500" font-style="italic" fill="var(--_text-sec)">&lt;&lt;abstract&gt;&gt;</text>
  <text x="121.5" y="70" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Animal</text>
  <line x1="40" y1="88" x2="203" y2="88" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="40" y1="112" x2="203" y2="112" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="160" x2="203" y2="160" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="136" x2="203" y2="136" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="103.4" y1="88" x2="103.4" y2="184" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="48" y="102" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="111.4" y="102" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">name</tspan></text>
  <text class="mono" x="48" y="122" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">int</text><text class="mono" x="111.4" y="122" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">age</tspan></text>
  <text class="mono" x="48" y="150" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="111.4" y="150" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">eat()</tspan></text>
  <text class="mono" x="48" y="170" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="111.4" y="170" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">sleep()</tspan></text>
  <rect x="40" y="40" width="163" height="144" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Dog" data-label="Dog">
  <rect x="44.19999999999999" y="244" width="154.60000000000002" height="88" rx="6" ry="6" fill="var(--bg)" />
  <path d="M44.19999999999999,276 L44.19999999999999,250 Q44.19999999999999,244 50.19999999999999,244 L192.8,244 Q198.8,244 198.8,250 L198.8,276 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="121.5" y="260" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Dog</text>
  <line x1="44.19999999999999" y1="276" x2="198.8" y2="276" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="44.19999999999999" y1="304" x2="198.8" y2="304" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="107.6" y1="276" x2="107.6" y2="332" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="52.19999999999999" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="115.6" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">breed</tspan></text>
  <text class="mono" x="52.19999999999999" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="115.6" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">bark()</tspan></text>
  <rect x="44.19999999999999" y="244" width="154.60000000000002" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
</svg>
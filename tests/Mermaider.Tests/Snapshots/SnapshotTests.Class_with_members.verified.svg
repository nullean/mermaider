<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 396" width="246" height="396" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<path class="class-relationship" data-from="Animal" data-to="Dog" data-type="inheritance" data-marker-at="from" d="M123,204 L123,264" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-start="url(#ma2e31288-mk-triangle-s)" />
<g class="class-node" data-id="Animal" data-label="Animal" data-annotation="abstract">
  <rect x="40" y="40" width="166" height="164" rx="8" ry="8" fill="var(--bg)" stroke="none" />
  <path d="M40,92 L40,48 Q40,40 48,40 L198,40 Q206,40 206,48 L206,92 Z" fill="url(#ma2e31288-eb-p6)" />
  <line x1="40" y1="92" x2="206" y2="92" stroke="color-mix(in srgb, #86bcb6 42%, var(--bg))" stroke-width="1" />
  <rect x="40" y="40" width="166" height="164" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1.25" />
  <line x1="52" y1="120" x2="194" y2="120" stroke="var(--_line-soft)" stroke-width="1" />
  <line x1="52" y1="176" x2="194" y2="176" stroke="var(--_line-soft)" stroke-width="1" />
  <line x1="40" y1="148" x2="206" y2="148" stroke="color-mix(in srgb, #86bcb6 42%, var(--bg))" stroke-width="1" />
  <text x="123" y="56.64" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, #86bcb6 44%, var(--fg))" dy="4.2">«abstract»</text>
  <text x="123" y="74.32" text-anchor="middle" font-size="var(--fs-m)" font-weight="600" fill="var(--_text)" dy="5.6">Animal</text>
  <text x="56" y="106" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">String</text>
  <text x="111.2" y="106" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #86bcb6 44%, var(--fg))" dy="4.9">+</text>
  <text x="125.2" y="106" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">name</text>
  <text x="56" y="134" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">int</text>
  <text x="111.2" y="134" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #86bcb6 44%, var(--fg))" dy="4.9">+</text>
  <text x="125.2" y="134" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">age</text>
  <text x="56" y="162" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">void</text>
  <text x="111.2" y="162" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #86bcb6 44%, var(--fg))" dy="4.9">+</text>
  <text x="125.2" y="162" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">eat()</text>
  <text x="56" y="190" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">void</text>
  <text x="111.2" y="190" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #86bcb6 44%, var(--fg))" dy="4.9">+</text>
  <text x="125.2" y="190" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">sleep()</text>
</g>
<g class="class-node" data-id="Dog" data-label="Dog">
  <rect x="44.199999999999996" y="264" width="157.6" height="92" rx="8" ry="8" fill="var(--bg)" stroke="none" />
  <path d="M44.199999999999996,300 L44.199999999999996,272 Q44.199999999999996,264 52.199999999999996,264 L193.79999999999998,264 Q201.79999999999998,264 201.79999999999998,272 L201.79999999999998,300 Z" fill="url(#ma2e31288-eb-p0)" />
  <line x1="44.199999999999996" y1="300" x2="201.79999999999998" y2="300" stroke="color-mix(in srgb, #4e79a7 42%, var(--bg))" stroke-width="1" />
  <rect x="44.199999999999996" y="264" width="157.6" height="92" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <line x1="44.199999999999996" y1="328" x2="201.79999999999998" y2="328" stroke="color-mix(in srgb, #4e79a7 42%, var(--bg))" stroke-width="1" />
  <text x="123" y="282" text-anchor="middle" font-size="var(--fs-m)" font-weight="600" fill="var(--_text)" dy="5.6">Dog</text>
  <text x="60.2" y="314" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">String</text>
  <text x="115.4" y="314" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #4e79a7 44%, var(--fg))" dy="4.9">+</text>
  <text x="129.4" y="314" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">breed</text>
  <text x="60.2" y="342" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">void</text>
  <text x="115.4" y="342" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #4e79a7 44%, var(--fg))" dy="4.9">+</text>
  <text x="129.4" y="342" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">bark()</text>
</g>
<defs>
  <linearGradient id="ma2e31288-eb-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #4e79a7 22%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #4e79a7 15%, var(--bg))" /></linearGradient>
  <linearGradient id="ma2e31288-eb-p6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #86bcb6 22%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #86bcb6 15%, var(--bg))" /></linearGradient>
  <marker id="ma2e31288-mk-triangle-s" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="0" refY="6" orient="auto">
    <polygon points="10,0.5 0,6 10,11.5" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.25" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>
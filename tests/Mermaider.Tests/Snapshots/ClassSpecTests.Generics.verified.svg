  <line x1="272" y1="188" x2="447.6" y2="188" stroke="#D36F0D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="280" y="202" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">getById(id)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">User</tspan></text>
  <rect x="272" y="148" width="175.6" height="68" rx="6" ry="6" fill="none" stroke="#D36F0D" stroke-width="1.75" />

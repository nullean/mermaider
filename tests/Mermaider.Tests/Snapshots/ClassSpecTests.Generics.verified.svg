  <text class="mono" x="48" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">List~T~</text><text class="mono" x="119.8" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">findAll()</tspan></text><text class="mono" x="246.6" y="134" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <rect x="40" y="40" width="214.6" height="108" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />

  <path d="M331.38,72 L331.38,46 Q331.38,40 337.38,40 L445.22,40 Q451.22,40 451.22,46 L451.22,72 Z" fill="color-mix(in srgb, #f28e2b 24%, var(--bg))" />
  <text x="391.3" y="56" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Repository~T~</text>

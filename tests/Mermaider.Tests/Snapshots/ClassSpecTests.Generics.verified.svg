  <rect x="299.88" y="40" width="119.84" height="48" rx="6" ry="6" fill="var(--bg)" />
  <path d="M299.88,72 L299.88,46 Q299.88,40 305.88,40 L413.72,40 Q419.72,40 419.72,46 L419.72,72 Z" fill="color-mix(in srgb, #f28e2b 24%, var(--bg))" />
  <text x="359.8" y="56" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Repository~T~</text>
  <line x1="299.88" y1="72" x2="419.72" y2="72" stroke="#D36F0D" stroke-width="1.75" />
  <line x1="299.88" y1="80" x2="419.72" y2="80" stroke="#D36F0D" stroke-width="1" opacity="0.35" />
  <rect x="299.88" y="40" width="119.84" height="48" rx="6" ry="6" fill="none" stroke="#D36F0D" stroke-width="1.75" />
</g>
</svg>
  <text class="mono" x="48" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">List~T~</text><text class="mono" x="119.8" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">findAll()</tspan></text><text class="mono" x="246.6" y="134" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #4e79a7 74%, var(--fg))">+</text>

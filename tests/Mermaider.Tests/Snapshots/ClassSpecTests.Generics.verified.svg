  <text x="360" y="194" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">getById(id)</text>
</g>
<g class="class-node" data-id="Repository~T~" data-label="Repository~T~">
  <rect x="321" y="40" width="149.6" height="36" rx="8" ry="8" fill="url(#md68a0f86-ng-p1)" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" />
  <text x="395.8" y="58" text-anchor="middle" font-size="var(--fs-m)" font-weight="600" fill="var(--_text)" dy="5.6">Repository~T~</text>
</g>
<defs>
  <linearGradient id="md68a0f86-eb-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #64748b 22%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #64748b 15%, var(--bg))" /></linearGradient>
  <linearGradient id="md68a0f86-eb-p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #f28e2b 22%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #f28e2b 15%, var(--bg))" /></linearGradient>
  <linearGradient id="md68a0f86-ng-p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #f28e2b 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #f28e2b 7%, var(--bg))" /></linearGradient>
  <marker id="md68a0f86-mk-triangle-s" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="0" refY="6" orient="auto">
    <polygon points="10,0.5 0,6 10,11.5" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.25" stroke-linejoin="miter" />
  </marker>

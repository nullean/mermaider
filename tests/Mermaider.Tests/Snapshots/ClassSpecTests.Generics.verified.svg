  <rect x="272" y="148" width="175.6" height="68" rx="6" ry="6" fill="var(--bg)" />
  <path d="M272,180 L272,154 Q272,148 278,148 L441.6,148 Q447.6,148 447.6,154 L447.6,180 Z" fill="color-mix(in srgb, #f28e2b 24%, var(--bg))" />
  <text x="359.8" y="164" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">UserRepo</text>

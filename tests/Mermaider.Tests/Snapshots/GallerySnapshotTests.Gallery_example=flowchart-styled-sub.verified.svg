<path class="edge" data-from="E" data-to="A" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M110,579.2 L110,481 Q110,475 104,475 L96.5,475 Q90.5,475 90.5,469 L90.5,125 Q90.5,119 96.5,119 L140,119 Q146,119 146,113 L146,84.8" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />  <text x="110.672" y="256.6" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Foo SubGraph</text>

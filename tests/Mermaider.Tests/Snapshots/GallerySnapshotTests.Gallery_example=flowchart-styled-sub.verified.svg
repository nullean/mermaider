<path class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M146.672,387.2 L146.672,455.2" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="E" data-to="A" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M181.344,477.59999999999997 L316.688,477.59999999999997 Q322.688,477.59999999999997 322.688,471.59999999999997 L322.688,68.4 Q322.688,62.4 316.688,62.4 L181.344,62.4" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="B" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M181.344,163.2 L195.344,163.2 Q201.344,163.2 201.344,169.2 L201.344,358.79999999999995 Q201.344,364.79999999999995 195.344,364.79999999999995 L181.344,364.79999999999995" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />  <rect x="96" y="197.6" width="101.344" height="30" rx="8" ry="8" fill="var(--_group-hdr)" stroke="var(--_group-stroke)" stroke-width="1.75" />
  <text x="108" y="212.6" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Foo SubGraph</text>
  <rect x="96" y="411.2" width="206.688" height="30" rx="8" ry="8" fill="var(--_group-hdr)" stroke="var(--_group-stroke)" stroke-width="1.75" />
  <text x="108" y="426.2" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Bar SubGraph</text>


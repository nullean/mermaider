<path class="edge" data-from="B" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M155.5,145.5 L155.5,161.5 Q155.5,167.5 161.5,167.5 L192,167.5 Q198,167.5 198,173.5 L198,298.5 Q198,304.5 192,304.5 L161.5,304.5 Q155.5,304.5 155.5,310.5 L155.5,326.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M116.5,371 L116.5,421 Q116.5,427 122.5,427 L135.5,427 Q141.5,427 141.5,433 L141.5,463 Q141.5,469 135.5,469 L113.5,469 Q107.5,469 107.5,475 L107.5,491" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="E" data-to="A" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M48,501 L22,501 Q16,501 16,495 L16,57 Q16,51 22,51 L106.5,51" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />  <text x="74.54399999999998" y="200.6" font-size="var(--fs-s)" font-weight="600" fill="#F18921" dy="4.8999999999999995">Foo SubGraph</text>
  <text x="36" y="450.2" font-size="var(--fs-s)" font-weight="600" fill="#DF4E50" dy="4.8999999999999995">Bar SubGraph</text>


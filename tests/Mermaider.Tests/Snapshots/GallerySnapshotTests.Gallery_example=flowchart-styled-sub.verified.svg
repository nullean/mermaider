<path class="edge" data-from="B" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M171.5,145.5 L171.5,161.5 Q171.5,167.5 177.5,167.5 L208,167.5 Q214,167.5 214,173.5 L214,298.5 Q214,304.5 208,304.5 L177.5,304.5 Q171.5,304.5 171.5,310.5 L171.5,326.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M132.5,371 L132.5,421 Q132.5,427 138.5,427 L151.5,427 Q157.5,427 157.5,433 L157.5,463 Q157.5,469 151.5,469 L129.5,469 Q123.5,469 123.5,475 L123.5,491" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="E" data-to="A" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M64,513.5 L22,513.5 Q16,513.5 16,507.5 L16,44.5 Q16,38.5 22,38.5 L122.5,38.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />  <text x="90.54399999999998" y="200.6" font-size="var(--fs-s)" font-weight="600" fill="#F18921" dy="4.8999999999999995">Foo SubGraph</text>
  <text x="52" y="450.2" font-size="var(--fs-s)" font-weight="600" fill="#6FB3AE" dy="4.8999999999999995">Bar SubGraph</text>


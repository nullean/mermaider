<path class="edge" data-from="E" data-to="A" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M99.5,491 L99.5,469.5 Q99.5,469 99,469 L99,469 Q98.5,469 98.5,469.5 L98.5,477 Q98.5,483 92.5,483 L14,483 Q8,483 8,477 L8,89 Q8,83 14,83 L102.5,83 Q108.5,83 108.5,77 L108.5,61" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />  <text x="86.672" y="200.6" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Foo SubGraph</text>
  <text x="28" y="450.2" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Bar SubGraph</text>


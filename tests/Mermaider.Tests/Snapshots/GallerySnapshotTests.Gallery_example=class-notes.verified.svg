  <line x1="132.79999999999998" y1="220" x2="132.79999999999998" y2="276" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="77.39999999999998" y="234" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="140.79999999999998" y="234" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">name</tspan></text><text class="mono" x="208.79999999999998" y="234" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <text class="mono" x="77.39999999999998" y="254" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="140.79999999999998" y="254" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">email</tspan></text><text class="mono" x="208.79999999999998" y="254" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <rect x="69.39999999999998" y="188" width="147.4" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="note">
  <line x1="256.2" y1="55" x2="246.2" y2="84" stroke="var(--_accent-stroke)" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="256.2" y="40" width="157.424" height="30" rx="6" ry="6" fill="var(--_accent-fill)" stroke="var(--_accent-stroke)" stroke-width="2" />
  <text x="334.912" y="55" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_accent-text)" dy="4.8999999999999995">Handles all user CRUD</text>
</g>
<g class="note">
  <line x1="226.79999999999998" y1="203" x2="216.79999999999998" y2="232" stroke="var(--_accent-stroke)" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="226.79999999999998" y="188" width="130.964" height="30" rx="6" ry="6" fill="var(--_accent-fill)" stroke="var(--_accent-stroke)" stroke-width="2" />
  <text x="292.282" y="203" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_accent-text)" dy="4.8999999999999995">Core domain entity</text>

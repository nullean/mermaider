  <line x1="40" y1="80" x2="246.2" y2="80" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <line x1="86.6" y1="72" x2="86.6" y2="128" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1" opacity="0.35" />
  <text class="mono" x="48" y="94" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">User</text><text class="mono" x="94.6" y="94" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">createUser()</tspan></text><text class="mono" x="238.2" y="94" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #4e79a7 74%, var(--fg))">+</text>
  <text class="mono" x="48" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="94.6" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">deleteUser(id)</tspan></text><text class="mono" x="238.2" y="114" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="color-mix(in srgb, #4e79a7 74%, var(--fg))">+</text>
  <rect x="40" y="40" width="206.2" height="88" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
</g>
<g class="class-node" data-id="User" data-label="User">
  <rect x="69.39999999999998" y="188" width="147.4" height="88" rx="8" ry="8" fill="var(--bg)" />

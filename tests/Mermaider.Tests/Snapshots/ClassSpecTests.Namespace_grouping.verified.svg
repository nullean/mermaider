  <text x="147.6" y="112" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">User</text>
  <line x1="76.6" y1="128" x2="218.6" y2="128" stroke="#3B5B7D" stroke-width="1.75" />
  <text class="mono" x="84.6" y="142" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">name</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">String</tspan></text>
  <line x1="76.6" y1="156" x2="218.6" y2="156" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="84.6" y="170" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">login()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="76.6" y="96" width="142" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>

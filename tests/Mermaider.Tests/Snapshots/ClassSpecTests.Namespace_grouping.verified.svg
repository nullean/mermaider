  <text x="147.59999999999997" y="260" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Order</text>
  <line x1="72.39999999999998" y1="276" x2="222.79999999999998" y2="276" stroke="#3B5B7D" stroke-width="1.75" />
  <text class="mono" x="80.39999999999998" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">id</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">int</tspan></text>
  <line x1="72.39999999999998" y1="304" x2="222.79999999999998" y2="304" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="80.39999999999998" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">submit()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="72.39999999999998" y="244" width="150.4" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Database" data-label="Database">
  <rect x="64" y="472" width="167.2" height="88" rx="6" ry="6" fill="var(--bg)" />
  <path d="M64,504 L64,478 Q64,472 70,472 L225.2,472 Q231.2,472 231.2,478 L231.2,504 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="147.6" y="488" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Database</text>
  <line x1="64" y1="504" x2="231.2" y2="504" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="64" y1="512" x2="231.2" y2="512" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="72" y="526" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">connect()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <text class="mono" x="72" y="546" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">query(sql)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="64" y="472" width="167.2" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />

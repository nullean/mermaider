<line x1="28" y1="142" x2="1068" y2="142" stroke="var(--_line)" stroke-width="3" marker-end="url(#timeline-arrow)" />
<rect x="40" y="78" width="180" height="36" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 22%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
<text x="130" y="96" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">2010</text>
<circle cx="130" cy="142" r="6" fill="color-mix(in srgb, #4e79a7 22%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />

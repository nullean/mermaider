<rect x="458" y="168" width="160" height="64" rx="8" ry="8" fill="color-mix(in srgb, #f28e2b 11%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" />
<text x="538" y="182" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Opens the first</text>
<text x="538" y="200" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">international office in</text>
<text x="538" y="218" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Berlin</text>

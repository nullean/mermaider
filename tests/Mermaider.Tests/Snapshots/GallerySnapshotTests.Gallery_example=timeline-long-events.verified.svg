<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 338" width="1080" height="338" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
</defs>

<text x="540" y="28" text-anchor="middle" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)">Company History</text>
<rect x="32" y="90" width="400" height="230" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 6%, var(--bg))" stroke="#4B74A0" stroke-width="1.75" />
<text x="232" y="106" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="#4B74A0">Founding</text>
<circle cx="130" cy="120" r="8" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
<text x="130" y="148" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">2010</text>
<rect x="50" y="164" width="160" height="64" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
<text x="130" y="178" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Two friends start</text>
<text x="130" y="196" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">building a prototype in</text>
<text x="130" y="214" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">a garage</text>
<rect x="50" y="234" width="160" height="46" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
<text x="130" y="248" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">First paying customer</text>
<text x="130" y="266" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">signs up</text>
<circle cx="334" cy="120" r="8" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
<text x="334" y="148" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">2012</text>
<rect x="254" y="164" width="160" height="64" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
<text x="334" y="178" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Seed round closes and</text>
<text x="334" y="196" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">the first five engineers</text>
<text x="334" y="214" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">join</text>
<rect x="440" y="90" width="400" height="230" rx="8" ry="8" fill="color-mix(in srgb, #f28e2b 6%, var(--bg))" stroke="#F18921" stroke-width="1.75" />
<text x="640" y="106" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="#F18921">Scale</text>
<circle cx="538" cy="120" r="8" fill="color-mix(in srgb, #f28e2b 24%, var(--bg))" stroke="#D36F0D" stroke-width="1.75" />
<text x="538" y="148" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">2015</text>
<rect x="458" y="164" width="160" height="64" rx="6" ry="6" fill="color-mix(in srgb, #f28e2b 16%, var(--bg))" stroke="#D36F0D" stroke-width="1.75" />
<text x="538" y="178" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Opens the first</text>
<text x="538" y="196" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">international office in</text>
<text x="538" y="214" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Berlin</text>
<rect x="458" y="234" width="160" height="46" rx="6" ry="6" fill="color-mix(in srgb, #f28e2b 16%, var(--bg))" stroke="#D36F0D" stroke-width="1.75" />
<text x="538" y="248" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Launches the</text>
<text x="538" y="266" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">self-serve plan</text>
<circle cx="742" cy="120" r="8" fill="color-mix(in srgb, #f28e2b 24%, var(--bg))" stroke="#D36F0D" stroke-width="1.75" />
<text x="742" y="148" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">2018</text>
<rect x="662" y="164" width="160" height="64" rx="6" ry="6" fill="color-mix(in srgb, #f28e2b 16%, var(--bg))" stroke="#D36F0D" stroke-width="1.75" />
<text x="742" y="178" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Acquires a small</text>
<text x="742" y="196" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">analytics startup to</text>
<text x="742" y="214" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">extend the platform</text>
<rect x="848" y="90" width="196" height="230" rx="8" ry="8" fill="color-mix(in srgb, #76b7b2 6%, var(--bg))" stroke="#6FB3AE" stroke-width="1.75" />
<text x="946" y="106" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="#6FB3AE">Today</text>
<circle cx="946" cy="120" r="8" fill="color-mix(in srgb, #76b7b2 24%, var(--bg))" stroke="#539D97" stroke-width="1.75" />
<text x="946" y="148" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)">2023</text>
<rect x="866" y="164" width="160" height="64" rx="6" ry="6" fill="color-mix(in srgb, #76b7b2 16%, var(--bg))" stroke="#539D97" stroke-width="1.75" />
<text x="946" y="178" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Reaches ten thousand</text>
<text x="946" y="196" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">customers across</text>
<text x="946" y="214" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">forty countries</text>
<line x1="120" y1="120" x2="956" y2="120" stroke="var(--_line)" stroke-width="2" />
</svg>
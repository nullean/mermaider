<rect x="254" y="168" width="160" height="64" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
<text x="334" y="182" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" fill="var(--_text)">Seed round closes and</text>

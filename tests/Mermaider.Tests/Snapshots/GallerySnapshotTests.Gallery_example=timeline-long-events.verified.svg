<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1076 326" width="1076" height="326" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<defs>
  <marker id="timeline-arrow" refX="6" refY="3" markerWidth="8" markerHeight="6" orient="auto">
    <path d="M 0,0 V 6 L8,3 Z" fill="var(--_line)" />
  </marker>
</defs>

<text x="538" y="28" text-anchor="middle" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)">Company History</text>
<rect x="32" y="44" width="400" height="266" rx="12" ry="12" fill="color-mix(in srgb, #4e79a7 6%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 42%, var(--bg))" stroke-width="1.25" />
<text x="232" y="62" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #4e79a7 42%, var(--bg))">Founding</text>
<rect x="440" y="44" width="400" height="266" rx="12" ry="12" fill="color-mix(in srgb, #f28e2b 6%, var(--bg))" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1.25" />
<text x="640" y="62" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #f28e2b 42%, var(--bg))">Scale</text>
<rect x="848" y="44" width="196" height="266" rx="12" ry="12" fill="color-mix(in srgb, #76b7b2 6%, var(--bg))" stroke="color-mix(in srgb, #76b7b2 42%, var(--bg))" stroke-width="1.25" />
<text x="946" y="62" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #76b7b2 42%, var(--bg))">Today</text>
<line x1="130" y1="114" x2="130" y2="304" stroke="color-mix(in srgb, #4e79a7 45%, var(--bg))" stroke-width="1.5" stroke-dasharray="4 4" />
<line x1="334" y1="114" x2="334" y2="304" stroke="color-mix(in srgb, #4e79a7 45%, var(--bg))" stroke-width="1.5" stroke-dasharray="4 4" />
<line x1="538" y1="114" x2="538" y2="304" stroke="color-mix(in srgb, #f28e2b 45%, var(--bg))" stroke-width="1.5" stroke-dasharray="4 4" />

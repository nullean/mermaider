  <rect x="170.556" y="513.158" width="234.416" height="86.4" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="287.764" y="556.3580000000001" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)"><tspan x="287.764" dy="-15.200000000000001">Load toc-v2.yml</tspan><tspan x="287.764" dy="20.8">(required — no fallback to</tspan><tspan x="287.764" dy="20.8">toc.yml)</tspan></text>
</g>

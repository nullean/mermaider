  <text x="455.544" y="187.25" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)"><tspan x="455.544" dy="-15.200000000000001">navigation-v2.yml URI</tspan><tspan x="455.544" dy="20.8">resolved</tspan><tspan x="455.544" dy="20.8">to repo checkout on disk</tspan></text>
</g>
<g class="node" data-id="v1Nodes" data-label="V1 TableOfContentNodes" data-shape="rectangle">
  <rect x="42.18800000000002" y="292.90000000000003" width="234.41599999999997" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="159.39600000000002" y="315.3" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">V1 TableOfContentNodes</text>
</g>
<g class="node" data-id="hasV2" data-label="docset-v2.yml

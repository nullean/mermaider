<path class="edge" data-from="loadV2" data-to="v2Nodes" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M311.76400000000007,604.208 L311.76400000000007,660.208" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="loadFallback" data-to="v2NodesFallback" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M594.036,604.208 L594.036,660.208" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

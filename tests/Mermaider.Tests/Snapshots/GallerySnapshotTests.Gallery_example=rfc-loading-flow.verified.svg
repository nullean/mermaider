  <rect x="292.618" y="435.256" width="38.292" height="30.2" rx="10" ry="10" fill="var(--bg)" stroke="none" />
<text x="311.764" y="450.356" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Yes</text>
</g>

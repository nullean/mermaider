  <text x="408.64" y="164.8" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)"><tspan x="408.64" dy="-15.200000000000001">navigation-v2.yml URI</tspan><tspan x="408.64" dy="20.8">resolved</tspan><tspan x="408.64" dy="20.8">to repo checkout on disk</tspan></text>
</g>

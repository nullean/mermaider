  <text x="135.944" y="176.85000000000002" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)"><tspan x="135.944" dy="-4.800000000000001">Load docset.yml + toc.yml</tspan><tspan x="135.944" dy="20.8">(every repo)</tspan></text>
</g>

  <polygon points="428.9,292.90000000000003 507.804,371.80400000000003 428.9,450.708 349.996,371.80400000000003" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="428.9" y="371.80400000000003" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)"><tspan x="428.9" dy="-4.800000000000001">docset-v2.yml</tspan><tspan x="428.9" dy="20.8">present?</tspan></text>
</g>
<g class="node" data-id="loadV2" data-label="Load toc-v2.yml

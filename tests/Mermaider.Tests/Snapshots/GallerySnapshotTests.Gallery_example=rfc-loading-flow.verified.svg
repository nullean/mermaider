<path class="edge" data-from="v1Load" data-to="v1Nodes" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M159.944,227.2 C159.944,265.6 183.39600000000002,265.6 183.39600000000002,304" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="uriResolve" data-to="hasV2" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M479.544,248 C479.544,276 452.9,276 452.9,304" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="hasV2" data-to="loadV2" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Yes" d="M373.996,382.904 L317.764,382.904 Q311.764,382.904 311.764,388.904 L311.764,450.356 L311.764,450.356 L311.764,517.808" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

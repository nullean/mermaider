  <text x="287.76400000000007" y="684.408" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">V2 TableOfContentNodes</text>
</g>
<g class="node" data-id="v2NodesFallback" data-label="V2 TableOfContentNodes
(V1 structure)" data-shape="rectangle">
  <rect x="450.092" y="662.008" width="239.88799999999998" height="65.6" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="570.036" y="694.808" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)"><tspan x="570.036" dy="-4.800000000000001">V2 TableOfContentNodes</tspan><tspan x="570.036" dy="20.8">(V1 structure)</tspan></text>
</g>
</svg>
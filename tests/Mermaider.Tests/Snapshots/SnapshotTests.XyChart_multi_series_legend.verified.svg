  <linearGradient id="m6dc990bb-bg-d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f28e2b" /><stop offset="1" stop-color="color-mix(in srgb, #f28e2b 62%, var(--bg))" /></linearGradient>
</defs>

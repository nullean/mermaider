  <rect x="155.08800000000002" y="185.6" width="159.632" height="44.8" rx="6" ry="6" fill="#f96" stroke="#333" stroke-width="2px" />
  <text x="234.90400000000002" y="208" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="#fff" dy="5.6">Also Important</text>
</g>
</svg>
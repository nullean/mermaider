  <rect x="16" y="185.6" width="103.088" height="44.8" rx="6" ry="6" fill="#eee" stroke="#ccc" stroke-width="2" />
  <text x="67.544" y="208" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="#999" dy="5.6">Muted</text>
</g>

<path class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M132.97866666666667,145.6 L132.97866666666667,159.6 Q132.97866666666667,165.6 126.97866666666667,165.6 L73.544,165.6 Q67.544,165.6 67.544,171.6 L67.544,185.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="B" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M169.46933333333334,145.6 L169.46933333333334,159.6 Q169.46933333333334,165.6 175.46933333333334,165.6 L228.90400000000002,165.6 Q234.90400000000002,165.6 234.90400000000002,171.6 L234.90400000000002,185.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="Important" data-shape="rectangle">
  <rect x="89.19200000000001" y="16" width="124.06400000000001" height="44.8" rx="6" ry="6" fill="#f96" stroke="#333" stroke-width="2px" />
  <text x="151.22400000000002" y="38.4" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="#fff" dy="5.6">Important</text>
</g>
<g class="node" data-id="B" data-label="Normal" data-shape="rectangle">
  <rect x="96.488" y="100.8" width="109.47200000000001" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="151.224" y="123.19999999999999" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Normal</text>
</g>

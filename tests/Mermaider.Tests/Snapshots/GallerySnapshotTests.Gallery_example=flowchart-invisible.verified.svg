  <text x="323.65599999999995" y="264" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Connected Below</text>
</g>
<g class="node" data-id="D" data-label="Also Below" data-shape="rectangle">
  <rect x="58.24000000000001" y="241.6" width="137.74399999999997" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="127.112" y="264" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Also Below</text>
</g>
<g class="node" data-id="E" data-label="Merged" data-shape="rectangle">
  <rect x="167.45599999999996" y="342.4" width="115.856" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="225.38399999999996" y="364.79999999999995" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Merged</text>
</g>
</svg>
  <rect x="265.664" y="140.8" width="174.224" height="44.8" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="352.77599999999995" y="163.20000000000002" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Positioned Right</text>
</g>
<g class="node" data-id="C" data-label="Connected Below" data-shape="rectangle">
  <rect x="40" y="140.8" width="183.344" height="44.8" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="131.672" y="163.20000000000002" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Connected Below</text>
</g>
<g class="node" data-id="D" data-label="Also Below" data-shape="rectangle">
  <rect x="280.744" y="241.6" width="137.74399999999997" height="44.8" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="349.616" y="264" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Also Below</text>
</g>
<g class="node" data-id="E" data-label="Merged" data-shape="rectangle">
  <rect x="291.688" y="342.4" width="115.856" height="44.8" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="349.616" y="364.79999999999995" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Merged</text>
</g>
</svg>
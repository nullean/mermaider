<circle class="architecture-port" cx="344" cy="290" r="3" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
<circle class="architecture-port" cx="344" cy="178" r="3" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
<path class="architecture-edge" data-source="server" data-target="db" d="M284,336 L172,336" fill="none" stroke="var(--_line)" stroke-width="1.5" />

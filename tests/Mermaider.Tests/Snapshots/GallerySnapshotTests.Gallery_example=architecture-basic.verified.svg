<circle class="architecture-port" cx="172" cy="336" r="3" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
<g class="architecture-group-title" data-id="api">
<g transform="translate(45 38) scale(0.818)" fill="none" stroke="color-mix(in srgb, #f28e2b 44%, var(--fg))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-7 4.5 C-11 4.5 -11 -1.5 -6 -1.5 C-6 -6.5 3 -7.5 4 -1.5 C10 -2.5 11 4.5 6 4.5Z" /></g>
<text x="60" y="38" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #f28e2b 44%, var(--fg))" dy="4.9">API</text>
</g>

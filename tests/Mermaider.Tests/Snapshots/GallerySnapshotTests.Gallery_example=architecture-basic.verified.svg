  <g transform="translate(344 118) scale(1.182)" fill="none" stroke="color-mix(in srgb, #4e79a7 44%, var(--fg))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-9 -8 H9 L7 9 H-7Z" /><path d="M-9 -8 C-9 -11 9 -11 9 -8" /></g>
  <text x="344" y="158" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Storage</text>
</g>

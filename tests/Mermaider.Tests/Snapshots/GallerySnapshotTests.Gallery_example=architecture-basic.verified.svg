  <g transform="translate(344 322) scale(1.182)" fill="none" stroke="color-mix(in srgb, #4e79a7 44%, var(--fg))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-9" width="20" height="7" rx="2" /><rect x="-10" y="2" width="20" height="7" rx="2" /><path d="M-5 -5.5 H-4 M-5 5.5 H-4" /></g>
  <text x="344" y="362" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Server</text>

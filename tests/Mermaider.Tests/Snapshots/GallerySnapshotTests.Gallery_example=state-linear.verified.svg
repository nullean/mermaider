  <rect x="32.75800000000001" y="70" width="72.42399999999999" height="42.2" rx="14" ry="14" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="68.97" y="91.1" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Draft</text>
</g>

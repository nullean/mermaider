  <rect x="24.777999999999995" y="204.05" width="88.384" height="42.2" rx="14" ry="14" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="68.97" y="225.15" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Review</text>
</g>
<g class="node" data-id="Published" data-label="Published" data-shape="rounded">
  <rect x="16" y="338.1" width="105.94" height="42.2" rx="14" ry="14" fill="url(#m6dc990bb-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="68.97" y="359.2" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Published</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="stateend">
  <circle cx="68.97" cy="422.3" r="10" fill="none" stroke="var(--accent, var(--fg))" stroke-width="2" />
<circle cx="68.97" cy="422.3" r="6" fill="var(--accent, var(--fg))" />
  
</g>
<defs>
  <linearGradient id="m6dc990bb-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #4e79a7 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #4e79a7 7%, var(--bg))" /></linearGradient>
  <marker id="m6dc990bb-mk-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="10" refY="6" orient="auto">
    <polygon points="0,1.5 10,6 0,10.5" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>
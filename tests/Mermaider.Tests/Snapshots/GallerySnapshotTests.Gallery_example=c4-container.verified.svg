<text x="274" y="155" text-anchor="middle" font-size="var(--fs-xs)" fill="var(--_text)" font-weight="500">Uses [HTTPS]</text>
<text x="528" y="180" text-anchor="middle" font-size="var(--fs-xs)" fill="var(--_text)" font-weight="500">Uses [JSON/HTTPS]</text>
<text x="768" y="180" text-anchor="middle" font-size="var(--fs-xs)" fill="var(--_text)" font-weight="500">Reads from and writes to [JDBC]</text>
<text x="902" y="155" text-anchor="middle" font-size="var(--fs-xs)" fill="var(--_text)" font-weight="500">Sends e-mails [SMTP]</text>
</svg>
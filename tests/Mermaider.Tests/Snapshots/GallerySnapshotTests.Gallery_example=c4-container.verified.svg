<path d="M 788 138 A 100 12 0 0 0 988 138" fill="none" stroke="#3C7FC0" stroke-width="1.5" />
<text x="888" y="154" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" fill="#FFFFFF" opacity="0.85">[container db]</text>
<text x="888" y="172" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#FFFFFF">Database</text>

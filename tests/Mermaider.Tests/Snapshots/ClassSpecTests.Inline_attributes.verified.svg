<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 269.4 336" width="269.4" height="336" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="cls-inherit" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-composition" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <marker id="cls-aggregation" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-lollipop" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse">
    <circle cx="6" cy="6" r="5" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
</defs>

<path class="class-relationship" data-from="Animal" data-to="Dog" data-type="inheritance" data-marker-at="from" d="M134.7,148 L134.7,208" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-start="url(#cls-inherit)" />
<g class="class-node" data-id="Animal" data-label="Animal">
  <rect x="40" y="40" width="189.4" height="108" rx="6" ry="6" fill="var(--bg)" />
  <path d="M40,72 L40,46 Q40,40 46,40 L223.4,40 Q229.4,40 229.4,46 L229.4,72 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="134.7" y="56" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Animal</text>
  <line x1="40" y1="72" x2="229.4" y2="72" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="40" y1="96" x2="229.4" y2="96" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="40" y1="120" x2="229.4" y2="120" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="103.4" y1="72" x2="103.4" y2="148" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="48" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="111.4" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">name</tspan></text><text class="mono" x="221.4" y="86" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <text class="mono" x="48" y="106" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">int</text><text class="mono" x="111.4" y="106" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">age</tspan></text><text class="mono" x="221.4" y="106" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <text class="mono" x="48" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">bool</text><text class="mono" x="111.4" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">isMammal()</tspan></text><text class="mono" x="221.4" y="134" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <rect x="40" y="40" width="189.4" height="108" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Dog" data-label="Dog">
  <rect x="56.79999999999999" y="208" width="155.8" height="88" rx="6" ry="6" fill="var(--bg)" />
  <path d="M56.79999999999999,240 L56.79999999999999,214 Q56.79999999999999,208 62.79999999999999,208 L206.6,208 Q212.6,208 212.6,214 L212.6,240 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="134.7" y="224" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Dog</text>
  <line x1="56.79999999999999" y1="240" x2="212.6" y2="240" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="56.79999999999999" y1="268" x2="212.6" y2="268" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="120.19999999999999" y1="240" x2="120.19999999999999" y2="296" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="64.79999999999998" y="254" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="128.2" y="254" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">breed</tspan></text><text class="mono" x="204.6" y="254" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <text class="mono" x="64.79999999999998" y="282" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="128.2" y="282" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">bark()</tspan></text><text class="mono" x="204.6" y="282" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <rect x="56.79999999999999" y="208" width="155.8" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
</svg>
  <text class="mono" x="48" y="338" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">fetch()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="40" y="244" width="134" height="108" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Cat" data-label="Cat">
  <rect x="221.60000000000002" y="244" width="150.79999999999998" height="108" rx="6" ry="6" fill="var(--_node-fill)" stroke="none" />
  <rect x="221.60000000000002" y="244" width="150.79999999999998" height="32" rx="6" ry="6" fill="var(--_group-hdr)" stroke="none" />
  <rect x="221.60000000000002" y="250" width="150.79999999999998" height="26" fill="var(--_group-hdr)" stroke="none" />
  <text x="297" y="260" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Cat</text>

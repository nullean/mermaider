  <line x1="131.5" y1="112" x2="294.5" y2="112" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="131.5" y1="160" x2="294.5" y2="160" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="131.5" y1="136" x2="294.5" y2="136" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="194.9" y1="88" x2="194.9" y2="184" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="139.5" y="102" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="202.9" y="102" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">name</tspan></text>
  <text class="mono" x="139.5" y="122" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">int</text><text class="mono" x="202.9" y="122" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">age</tspan></text>
  <text class="mono" x="139.5" y="150" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="202.9" y="150" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">eat()</tspan></text>
  <text class="mono" x="139.5" y="170" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="202.9" y="170" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">sleep()</tspan></text>
  <rect x="131.5" y="40" width="163" height="144" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>

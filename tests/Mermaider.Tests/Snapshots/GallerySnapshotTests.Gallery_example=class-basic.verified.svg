  <text class="mono" x="48" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">String</text><text class="mono" x="111.4" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">breed</tspan></text>
  <text class="mono" x="48" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="111.4" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">bark()</tspan></text>

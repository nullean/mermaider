  <line x1="40" y1="276" x2="182" y2="276" stroke="#3B5B7D" stroke-width="1.75" />
  <text class="mono" x="48" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">breed</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">String</tspan></text>
  <line x1="40" y1="304" x2="182" y2="304" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="48" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">bark()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <text class="mono" x="48" y="338" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">fetch()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="40" y="244" width="142" height="108" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node" data-id="Cat" data-label="Cat">
  <rect x="202" y="244" width="158.79999999999998" height="108" rx="6" ry="6" fill="var(--bg)" />
  <path d="M202,276 L202,250 Q202,244 208,244 L354.79999999999995,244 Q360.79999999999995,244 360.79999999999995,250 L360.79999999999995,276 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="281.4" y="260" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Cat</text>
  <line x1="202" y1="276" x2="360.79999999999995" y2="276" stroke="#3B5B7D" stroke-width="1.75" />
  <text class="mono" x="210" y="290" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">indoor</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">bool</tspan></text>
  <line x1="202" y1="304" x2="360.79999999999995" y2="304" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="210" y="318" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">purr()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <text class="mono" x="210" y="338" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">scratch()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="202" y="244" width="158.79999999999998" height="108" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
</svg>
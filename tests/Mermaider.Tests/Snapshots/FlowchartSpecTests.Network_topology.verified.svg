  <rect x="272.12800000000004" y="446.6" width="155.98399999999998" height="52.8" rx="26.4" ry="26.4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="350.12" y="473" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">NAT Gateway</text>
</g>

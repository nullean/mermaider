  <text x="356.91999999999996" y="320.4" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">NAT Gateway</text>
</g>
<g class="node" data-id="app1" data-label="App Server 1" data-shape="rectangle">
  <rect x="79.11999999999998" y="462.8" width="149.60000000000002" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="153.92" y="485.2" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">App Server 1</text>
</g>
<g class="node" data-id="app2" data-label="App Server 2" data-shape="rectangle">
  <rect x="264.72" y="462.8" width="155.072" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="342.25600000000003" y="485.2" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">App Server 2</text>
</g>
<g class="node" data-id="db" data-label="Database" data-shape="cylinder">
  <rect x="184.232" y="554.6" width="127.712" height="44.8" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="none" />
<line x1="184.232" y1="554.6" x2="184.232" y2="599.4" stroke="#3B5B7D" stroke-width="2" />

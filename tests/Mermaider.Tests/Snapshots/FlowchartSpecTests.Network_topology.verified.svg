  <text x="147.464" y="320.4" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Load Balancer</text>
</g>
<g class="node" data-id="nat" data-label="NAT Gateway" data-shape="stadium">

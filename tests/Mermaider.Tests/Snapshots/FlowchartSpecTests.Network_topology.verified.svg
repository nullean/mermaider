<ellipse cx="213" cy="724.2" rx="63.856" ry="7" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="213" y="746.6" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Database</text>
</g>

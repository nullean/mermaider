<path class="edge" data-from="app2" data-to="nat" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M290.536,638.8 L326.464,638.8 Q332.464,638.8 332.464,632.8 L332.464,257.2 Q332.464,251.2 326.464,251.2 L290.99199999999996,251.2" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="app1" data-to="db" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M213,172.8 L213,194.8 Q213,200.8 207,200.8 L46,200.8 Q40,200.8 40,206.8 L40,416.6 Q40,422.6 46,422.6 L51.536,422.6 Q57.536,422.6 57.536,428.6 L57.536,560 Q57.536,566 63.536,566 L93.464,566 Q99.464,566 99.464,572 L99.464,660.8000000000001 Q99.464,666.8000000000001 105.464,666.8000000000001 L207,666.8000000000001 Q213,666.8000000000001 213,672.8000000000001 L213,717.2" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="lb" data-to="app1" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M296.464,538 L326.464,538 Q332.464,538 332.464,532 L332.464,156.4 Q332.464,150.4 326.464,150.4 L287.8,150.4" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />  <rect x="97.536" y="40" width="230.928" height="30" rx="8" ry="8" fill="var(--_group-hdr)" stroke="var(--_group-stroke)" stroke-width="1.75" />
  <text x="109.536" y="55" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Cloud VPC</text>
  <rect x="113.536" y="184.8" width="198.928" height="30" rx="8" ry="8" fill="var(--_group-hdr)" stroke="var(--_group-stroke)" stroke-width="1.75" />
  <text x="125.536" y="199.8" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Public Subnet</text>

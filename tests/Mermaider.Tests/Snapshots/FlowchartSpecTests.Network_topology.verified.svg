<path class="edge" data-from="lb" data-to="app1" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M280.79200000000003,255.4 L258.79200000000003,255.4 Q252.792,255.4 252.792,261.4 L252.792,296.6 L252.792,296.6 L252.792,337.8" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="lb" data-to="app2" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M447.72,255.4 L469.72,255.4 Q475.72,255.4 475.72,261.4 L475.72,296.6 L475.72,296.6 L475.72,337.8" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="app1" data-to="db" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M327.592,364.2 L358.256,364.2 Q364.256,364.2 364.256,370.2 L364.256,405.4 L364.256,405.4 L364.256,446.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="app2" data-to="db" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M475.72,390.6 C475.72,418.6 364.256,418.6 364.256,446.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="app1" data-to="nat" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M177.992,364.2 L155.992,364.2 Q149.992,364.2 149.992,370.2 L149.992,405.4 L149.992,405.4 L149.992,446.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="app2" data-to="nat" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M475.72,390.6 C475.72,418.6 149.992,418.6 149.992,446.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="nat" data-to="internet" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M227.98399999999998,473 L583.256,473 Q589.256,473 589.256,467 L589.256,112.5 Q589.256,106.5 583.256,106.5 L430.756,106.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />  <rect x="40" y="141" width="545.256" height="30" rx="8" ry="8" fill="var(--_group-hdr)" stroke="var(--_group-stroke)" stroke-width="1.75" />
  <text x="52" y="156" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Cloud VPC</text>
  <rect x="56" y="185" width="407.72" height="30" rx="8" ry="8" fill="var(--_group-hdr)" stroke="var(--_group-stroke)" stroke-width="1.75" />
  <text x="68" y="200" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Public Subnet</text>
  <rect x="161.992" y="293.8" width="407.264" height="30" rx="8" ry="8" fill="var(--_group-hdr)" stroke="var(--_group-stroke)" stroke-width="1.75" />
  <text x="173.992" y="308.8" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Private Subnet</text>


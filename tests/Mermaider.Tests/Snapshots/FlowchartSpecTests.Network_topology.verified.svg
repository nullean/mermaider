  <rect x="280.79200000000003" y="229" width="166.928" height="52.8" rx="26.4" ry="26.4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="364.25600000000003" y="255.4" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Load Balancer</text>
</g>
<g class="node" data-id="nat" data-label="NAT Gateway" data-shape="stadium">
  <rect x="72" y="446.6" width="155.98399999999998" height="52.8" rx="26.4" ry="26.4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="149.992" y="473" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">NAT Gateway</text>
</g>
<g class="node" data-id="app1" data-label="App Server 1" data-shape="rectangle">
  <rect x="177.992" y="337.8" width="149.60000000000002" height="52.8" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="252.792" y="364.2" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">App Server 1</text>
</g>
<g class="node" data-id="app2" data-label="App Server 2" data-shape="rectangle">
  <rect x="398.18399999999997" y="337.8" width="155.072" height="52.8" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />

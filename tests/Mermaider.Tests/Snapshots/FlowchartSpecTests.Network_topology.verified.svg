  <text x="177.92000000000002" y="541.1999999999999" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">App Server 1</text>
</g>
<g class="node" data-id="app2" data-label="App Server 2" data-shape="rectangle">
  <rect x="288.72" y="518.8" width="155.072" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="2" />
  <text x="366.25600000000003" y="541.1999999999999" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">App Server 2</text>
</g>

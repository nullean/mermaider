<ellipse cx="364.256" cy="506.4" rx="63.856" ry="7" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
<ellipse cx="364.256" cy="453.6" rx="63.856" ry="7" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />

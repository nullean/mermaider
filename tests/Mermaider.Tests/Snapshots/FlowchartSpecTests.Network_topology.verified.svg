<path class="edge" data-from="app1" data-to="nat" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M313.456,364.2 L344.12,364.2 Q350.12,364.2 350.12,370.2 L350.12,405.4 L350.12,405.4 L350.12,446.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="app2" data-to="nat" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M461.584,390.6 L461.584,412.6 Q461.584,418.6 455.584,418.6 L356.12,418.6 Q350.12,418.6 350.12,424.6 L350.12,446.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="nat" data-to="internet" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M428.112,473 L569.12,473 Q575.12,473 575.12,467 L575.12,112.5 Q575.12,106.5 569.12,106.5 L416.62,106.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />  <rect x="40" y="141" width="531.12" height="30" rx="8" ry="8" fill="var(--_group-hdr)" stroke="var(--_group-stroke)" stroke-width="1.75" />
  <text x="52" y="156" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">Cloud VPC</text>

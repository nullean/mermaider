<path class="edge" data-from="Recovering" data-to="Running" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="recovered" d="M102,317 L102,268.5 Q102,262.5 108,262.5 L141.5,262.5 Q147.5,262.5 147.5,256.5 L147.5,175 Q147.5,169 141.5,169 L108,169 Q102,169 102,163 L102,147" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Recovering" data-to="Fatal" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="max_retries" d="M88,362 L88,424" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Running" data-to="Stopped" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="shutdown" d="M116,147 L116,195.5 Q116,201.5 110,201.5 L14,201.5 Q8,201.5 8,207.5 L8,503.5 Q8,509.5 14,509.5 L82,509.5 Q88,509.5 88,515.5 L88,531.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Fatal" data-to="Stopped" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="operator" d="M88,469 L88,494 Q88,500 94,500 L96,500 Q102,500 102,506 L102,531.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Stopped" data-to="_end" data-style="solid" data-arrow-start="false" data-arrow-end="true" d="M88,576 L88,638.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

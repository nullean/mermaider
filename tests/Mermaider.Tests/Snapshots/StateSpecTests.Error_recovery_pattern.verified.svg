  <rect x="73.7144" y="564.275" width="76.5712" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="112" y="576.5" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">operator</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="statestart">
  <circle cx="112.064" cy="52" r="10" fill="var(--_text)" stroke="none" />
  
</g>

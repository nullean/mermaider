  <line x1="100" y1="155.2" x2="720" y2="155.2" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="88" y="155.2" text-anchor="end" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.199999999999999">160</text>
  <line x1="100" y1="92" x2="720" y2="92" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="88" y="92" text-anchor="end" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.199999999999999">200</text>
  <text x="151.667" y="428" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.199999999999999">90d</text>
  <text x="255" y="428" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.199999999999999">60d</text>
  <text x="358.333" y="428" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.199999999999999">30d</text>
  <text x="461.667" y="428" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.199999999999999">7d</text>
  <text x="565" y="428" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.199999999999999">1d</text>
  <text x="668.333" y="428" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.199999999999999">Current</text>
</g>
<g transform="translate(46 250) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.199999999999999">Seconds</text></g>
<line x1="100" y1="408" x2="720" y2="408" stroke="var(--_line)" stroke-width="1.25" />

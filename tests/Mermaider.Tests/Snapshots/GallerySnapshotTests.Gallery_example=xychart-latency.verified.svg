  <polyline points="151.67,230.72 255,289.03 358.33,245.26 461.67,128.34 565,123.28 668.33,235.15" fill="none" stroke="#e15759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="151.667" cy="230.724" r="3.5" fill="#e15759" stroke="var(--bg)" stroke-width="1.5" />

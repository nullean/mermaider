  <text x="70.42666666666665" y="301.275" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">request</text>
</g>
<g class="edge-label" data-from="Processing" data-to="Ready" data-label="done">
  <rect x="116.07148" y="289.04999999999995" width="52.53040000000001" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="142.33668" y="301.275" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">done</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="statestart">
  <circle cx="88.064" cy="28" r="10" fill="var(--_text)" stroke="none" />
  
</g>

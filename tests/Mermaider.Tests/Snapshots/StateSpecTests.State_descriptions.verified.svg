<path class="edge" data-from="Booting" data-to="Ready" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="initialized" d="M88.064,114.8 L88.064,209.25" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Ready" data-to="Processing" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="request" d="M70.42666666666665,254.05 L70.42666666666665,320.5 L70.42666666666665,320.5 L70.42666666666665,348.5" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Processing" data-to="Ready" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="done" d="M112.08533333333332,348.5 L112.08533333333332,326.5 Q112.08533333333332,320.5 118.08533333333332,320.5 L136.33668,320.5 Q142.33668,320.5 142.33668,314.5 L142.33668,288.05 Q142.33668,282.05 136.33668,282.05 L111.70133333333332,282.05 Q105.70133333333332,282.05 105.70133333333332,276.05 L105.70133333333332,254.05" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

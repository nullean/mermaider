<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 378" width="280" height="378" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<line class="lifeline" data-actor="Alice" x1="70" y1="70" x2="70" y2="308" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<line class="lifeline" data-actor="Bob" x1="210" y1="70" x2="210" y2="308" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<g class="message" data-from="Alice" data-to="Bob" data-label="1. Hello" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="114" x2="210" y2="114" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#md68a0f86-mk-arrow)" />
  <g class="autonumber"><circle cx="70" cy="114" r="9" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" /><text x="70" y="114" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--bg)" dy="4.2">1</text></g>
  <rect x="117.42" y="89.2" width="45.16" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="140" y="100" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Hello</text>
</g>
<g class="message" data-from="Bob" data-to="Alice" data-label="2. Hi" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="164" x2="70" y2="164" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#md68a0f86-mk-arrow)" />
  <g class="autonumber"><circle cx="210" cy="164" r="9" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" /><text x="210" y="164" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--bg)" dy="4.2">2</text></g>
  <rect x="125.628" y="139.2" width="28.744" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="140" y="150" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Hi</text>
</g>
<g class="message" data-from="Alice" data-to="Bob" data-label="3. Bye" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="214" x2="210" y2="214" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#md68a0f86-mk-arrow)" />
  <g class="autonumber"><circle cx="70" cy="214" r="9" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" /><text x="70" y="214" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--bg)" dy="4.2">3</text></g>
  <rect x="120.156" y="189.2" width="39.688" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="140" y="200" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Bye</text>
</g>
<g class="actor" data-id="Alice" data-label="Alice" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="8" ry="8" fill="url(#md68a0f86-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
  <text x="70" y="50" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Alice</text>
</g>
<g class="actor" data-id="Bob" data-label="Bob" data-type="participant">
  <rect x="170" y="30" width="80" height="40" rx="8" ry="8" fill="url(#md68a0f86-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
  <text x="210" y="50" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Bob</text>
</g>
<g class="actor actor-bottom" data-id="Alice" data-label="Alice" data-type="participant">
  <rect x="30" y="308" width="80" height="40" rx="8" ry="8" fill="url(#md68a0f86-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
  <text x="70" y="328" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Alice</text>
</g>
<g class="actor actor-bottom" data-id="Bob" data-label="Bob" data-type="participant">
  <rect x="170" y="308" width="80" height="40" rx="8" ry="8" fill="url(#md68a0f86-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
  <text x="210" y="328" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Bob</text>
</g>
<defs>
  <linearGradient id="md68a0f86-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #64748b 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #64748b 7%, var(--bg))" /></linearGradient>
  <marker id="md68a0f86-mk-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="10" refY="6" orient="auto">
    <polygon points="0,1.5 10,6 0,10.5" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>
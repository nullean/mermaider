<rect x="650" y="161" width="10" height="10" rx="3" ry="3" fill="#f28e2b" stroke="none" />
  <text x="668" y="166" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Team B</text>

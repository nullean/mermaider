  <text x="370" y="96" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text-sec)" dy="4.9">Design</text>
  <line x1="370" y1="292" x2="529.777" y2="240.085" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="556.41" y="231.43" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text-sec)" dy="4.9">Frontend</text>
  <line x1="370" y1="292" x2="468.748" y2="427.915" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="485.21" y="450.57" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text-sec)" dy="4.9">Backend</text>
  <line x1="370" y1="292" x2="271.252" y2="427.915" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="254.79" y="450.57" text-anchor="end" font-size="var(--fs-s)" font-weight="500" fill="var(--_text-sec)" dy="4.9">DevOps</text>
  <line x1="370" y1="292" x2="210.223" y2="240.085" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="183.59" y="231.43" text-anchor="end" font-size="var(--fs-s)" font-weight="500" fill="var(--_text-sec)" dy="4.9">Testing</text>
</g>
<g class="radar-curve" data-curve="c1">
  <polygon points="370,157.6 465.87,260.85 468.75,427.92 330.5,346.37 242.18,250.47" fill="#4e79a7" fill-opacity="0.2" stroke="#4e79a7" stroke-width="2" stroke-linejoin="round" />
  <circle cx="370" cy="157.6" r="3.5" fill="#4e79a7" stroke="var(--bg)" stroke-width="1.5" />

  <circle cx="330.501" cy="346.366" r="3.5" fill="#4e79a7" stroke="var(--bg)" stroke-width="1.5" />
  <circle cx="242.178" cy="250.468" r="3.5" fill="#4e79a7" stroke="var(--bg)" stroke-width="1.5" />
</g>

<path class="class-relationship" data-from="Drawable" data-to="Circle" data-type="realization" data-marker-at="from" d="M277.2,124 L277.2,143 Q277.2,149 271.2,149 L212.2,149 Q206.2,149 206.2,155 L206.2,184" fill="none" stroke="var(--_line)" stroke-width="2.25" stroke-dasharray="4 4" marker-start="url(#cls-inherit)" />

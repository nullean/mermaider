  <line x1="146.2" y1="216" x2="266.2" y2="216" stroke="var(--_node-stroke)" stroke-width="2" />
  <line x1="146.2" y1="224" x2="266.2" y2="224" stroke="var(--_node-stroke)" stroke-width="2" />
</g>
</svg>
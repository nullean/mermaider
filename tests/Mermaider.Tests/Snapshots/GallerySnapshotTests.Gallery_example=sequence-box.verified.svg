<defs>
  <linearGradient id="ma2e31288-cw-bx0-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg))" /><stop offset="0.55" stop-color="color-mix(in srgb, rgb(200,220,255) 6%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, rgb(200,220,255) 6%, var(--bg))" /></linearGradient>
  <linearGradient id="ma2e31288-cw-bx1-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg))" /><stop offset="0.55" stop-color="color-mix(in srgb, rgb(255,220,200) 6%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, rgb(255,220,200) 6%, var(--bg))" /></linearGradient>
  <linearGradient id="ma2e31288-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #4e79a7 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #4e79a7 7%, var(--bg))" /></linearGradient>
  <marker id="ma2e31288-mk-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="10" refY="6" orient="auto">

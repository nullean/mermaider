<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569.61 544" width="569.61" height="544" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<g class="box" data-label="Internal Services">
  <rect x="22" y="12" width="376" height="508" rx="12" ry="12" fill="url(#ma2e31288-cw-bx0-0)" stroke="color-mix(in srgb, rgb(200,220,255) 42%, var(--bg))" stroke-width="1" />
  <path d="M22,40 L22,24 Q22,12 34,12 L386,12 Q398,12 398,24 L398,40 Z" fill="color-mix(in srgb, rgb(200,220,255) 22%, var(--bg))" />
  <line x1="22" y1="40" x2="398" y2="40" stroke="color-mix(in srgb, rgb(200,220,255) 42%, var(--bg))" stroke-width="1" />
</g>
<rect x="32" y="20" width="3" height="12" rx="1.5" ry="1.5" fill="var(--accent, var(--fg))" />
<text x="42" y="26" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, rgb(200,220,255) 44%, var(--fg))" dy="4.8999999999999995">Internal Services</text>
<g class="box" data-label="External">
  <rect x="440.39" y="12" width="99.22000000000001" height="508" rx="12" ry="12" fill="url(#ma2e31288-cw-bx1-0)" stroke="color-mix(in srgb, rgb(255,220,200) 42%, var(--bg))" stroke-width="1" />
  <path d="M440.39,40 L440.39,24 Q440.39,12 452.39,12 L527.61,12 Q539.61,12 539.61,24 L539.61,40 Z" fill="color-mix(in srgb, rgb(255,220,200) 22%, var(--bg))" />
  <line x1="440.39" y1="40" x2="539.61" y2="40" stroke="color-mix(in srgb, rgb(255,220,200) 42%, var(--bg))" stroke-width="1" />
</g>
<rect x="450.39" y="20" width="3" height="12" rx="1.5" ry="1.5" fill="var(--accent, var(--fg))" />
<text x="460.39" y="26" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, rgb(255,220,200) 44%, var(--fg))" dy="4.8999999999999995">External</text>

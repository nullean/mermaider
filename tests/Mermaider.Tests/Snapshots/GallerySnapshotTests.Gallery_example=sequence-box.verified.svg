<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 528" width="568" height="528" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<defs>
  <marker id="seq-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
    <polygon points="0 0, 10 5, 0 10" fill="var(--_line)" />
  </marker>
  <marker id="seq-arrow-open" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
    <polyline points="0 0, 10 5, 0 10" fill="none" stroke="var(--_line)" stroke-width="2" />
  </marker>
</defs>

<g class="box" data-label="Internal Services">
  <rect x="22" y="4" width="376" height="530" rx="12" ry="12" fill="color-mix(in srgb, rgb(200,220,255) 16%, var(--bg))" stroke="rgb(200,220,255)" stroke-width="1.25" />
  <text x="210" y="14" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, rgb(200,220,255) 80%, var(--fg))" dy="4.199999999999999">Internal Services</text>
</g>
<g class="box" data-label="External">
  <rect x="442" y="4" width="96" height="530" rx="12" ry="12" fill="color-mix(in srgb, rgb(255,220,200) 16%, var(--bg))" stroke="rgb(255,220,200)" stroke-width="1.25" />
  <text x="490" y="14" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, rgb(255,220,200) 80%, var(--fg))" dy="4.199999999999999">External</text>
</g>
<line class="lifeline" data-actor="API" x1="70" y1="70" x2="70" y2="498" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Auth" x1="210" y1="70" x2="210" y2="498" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DB" x1="350" y1="70" x2="350" y2="498" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Client" x1="490" y1="70" x2="490" y2="498" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Client" data-to="API" data-label="Request" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="490" y1="114" x2="70" y2="114" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#seq-arrow)" />
  <rect x="245.99468000000002" y="85.2" width="68.01064" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="280" y="96" font-size="var(--fs-xs)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.199999999999999">Request</text>
</g>
<g class="message" data-from="API" data-to="Auth" data-label="Validate" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="164" x2="210" y2="164" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#seq-arrow)" />
  <rect x="106.71972" y="135.2" width="66.56056000000001" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="140" y="146" font-size="var(--fs-xs)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.199999999999999">Validate</text>
</g>
<g class="message" data-from="Auth" data-to="API" data-label="OK" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="214" x2="70" y2="214" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="121.22052" y="185.2" width="37.55896" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="140" y="196" font-size="var(--fs-xs)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.199999999999999">OK</text>
</g>
<g class="message" data-from="API" data-to="DB" data-label="Query" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="264" x2="350" y2="264" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#seq-arrow)" />
  <rect x="181.79500000000002" y="235.2" width="56.41" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="210" y="246" font-size="var(--fs-xs)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.199999999999999">Query</text>
</g>
<g class="message" data-from="DB" data-to="API" data-label="Data" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="314" x2="70" y2="314" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="186.87028" y="285.2" width="46.25944" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="210" y="296" font-size="var(--fs-xs)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.199999999999999">Data</text>
</g>
<g class="message" data-from="API" data-to="Client" data-label="Response" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="364" x2="490" y2="364" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="240.19436000000002" y="335.2" width="79.61128" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="280" y="346" font-size="var(--fs-xs)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.199999999999999">Response</text>
</g>
<g class="actor" data-id="API" data-label="API" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="70" y="50" font-size="var(--fs-s)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">API</text>
</g>
<g class="actor" data-id="Auth" data-label="Auth" data-type="participant">
  <rect x="170" y="30" width="80" height="40" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="210" y="50" font-size="var(--fs-s)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">Auth</text>
</g>
<g class="actor" data-id="DB" data-label="DB" data-type="participant">
  <rect x="310" y="30" width="80" height="40" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="350" y="50" font-size="var(--fs-s)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">DB</text>
</g>
<g class="actor" data-id="Client" data-label="Client" data-type="participant">
  <rect x="450" y="30" width="80" height="40" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="490" y="50" font-size="var(--fs-s)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">Client</text>
</g>
<g class="actor" data-id="API" data-label="API" data-type="participant">
  <rect x="30" y="458" width="80" height="40" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="70" y="478" font-size="var(--fs-s)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">API</text>
</g>
<g class="actor" data-id="Auth" data-label="Auth" data-type="participant">
  <rect x="170" y="458" width="80" height="40" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="210" y="478" font-size="var(--fs-s)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">Auth</text>
</g>
<g class="actor" data-id="DB" data-label="DB" data-type="participant">
  <rect x="310" y="458" width="80" height="40" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="350" y="478" font-size="var(--fs-s)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">DB</text>
</g>
<g class="actor" data-id="Client" data-label="Client" data-type="participant">
  <rect x="450" y="458" width="80" height="40" rx="8" ry="8" fill="color-mix(in srgb, #4e79a7 11%, var(--bg))" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <text x="490" y="478" font-size="var(--fs-s)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">Client</text>
</g>
</svg>
<linearGradient id="sankey-grad-2" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="716" y2="0"><stop offset="0%" stop-color="#76b7b2" stop-opacity="0.5" /><stop offset="100%" stop-color="#4e79a7" stop-opacity="0.5" /></linearGradient>
<linearGradient id="sankey-grad-3" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="716" y2="0"><stop offset="0%" stop-color="#76b7b2" stop-opacity="0.5" /><stop offset="100%" stop-color="#f28e2b" stop-opacity="0.5" /></linearGradient>
</defs>


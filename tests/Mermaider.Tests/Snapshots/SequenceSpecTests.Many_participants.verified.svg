<g class="message" data-from="Browser" data-to="CDN" data-label="Static assets" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="79.12" y1="100" x2="219.12" y2="100" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#seq-arrow)" />
  <text x="149.12" y="86" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Static assets</text>
</g>

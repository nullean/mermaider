<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 320" width="704" height="320" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="arch-arrow-end" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
    <polygon points="0 0, 12 6, 0 12" fill="var(--_line)" />
  </marker>
  <marker id="arch-arrow-start" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
    <polygon points="12 0, 0 6, 12 12" fill="var(--_line)" />
  </marker>
</defs>

<path class="architecture-edge" data-source="a" data-target="b" d="M104,64 L216,64" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="c" data-target="d" d="M488,64 L600,64" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arch-arrow-end)" />
<path class="architecture-edge" data-source="e" data-target="f" d="M104,256 L216,256" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-start="url(#arch-arrow-start)" />
<path class="architecture-edge" data-source="g" data-target="h" d="M488,256 L600,256" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-start="url(#arch-arrow-start)" marker-end="url(#arch-arrow-end)" />
<g class="architecture-service" data-id="a" data-icon="server">
  <rect x="24" y="24" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
  <image x="42" y="42" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="64" y="120" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Client</text>
</g>
<g class="architecture-service" data-id="b" data-icon="server">
  <rect x="216" y="24" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
  <image x="234" y="42" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="256" y="120" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Server</text>
</g>
<g class="architecture-service" data-id="c" data-icon="server">
  <rect x="408" y="24" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #f28e2b 16%, var(--bg))" stroke="#D36F0D" stroke-width="1.75" />
  <image x="426" y="42" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="448" y="120" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Sender</text>
</g>
<g class="architecture-service" data-id="d" data-icon="server">
  <rect x="600" y="24" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #f28e2b 16%, var(--bg))" stroke="#D36F0D" stroke-width="1.75" />
  <image x="618" y="42" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="640" y="120" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Receiver</text>
</g>
<g class="architecture-service" data-id="e" data-icon="server">
  <rect x="24" y="216" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #76b7b2 16%, var(--bg))" stroke="#539D97" stroke-width="1.75" />
  <image x="42" y="234" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="64" y="312" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Follower</text>
</g>
<g class="architecture-service" data-id="f" data-icon="server">
  <rect x="216" y="216" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #76b7b2 16%, var(--bg))" stroke="#539D97" stroke-width="1.75" />
  <image x="234" y="234" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="256" y="312" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Leader</text>
</g>
<g class="architecture-service" data-id="g" data-icon="server">
  <rect x="408" y="216" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #b07aa1 16%, var(--bg))" stroke="#955884" stroke-width="1.75" />
  <image x="426" y="234" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="448" y="312" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Node A</text>
</g>
<g class="architecture-service" data-id="h" data-icon="server">
  <rect x="600" y="216" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #b07aa1 16%, var(--bg))" stroke="#955884" stroke-width="1.75" />
  <image x="618" y="234" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="640" y="312" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Node B</text>
</g>
</svg>
<line class="lifeline" data-actor="DB" x1="354.01" y1="70" x2="354.01" y2="358" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<g class="message" data-from="User" data-to="API" data-label="GET /data" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="74.00999999999999" y1="114" x2="214.01" y2="114" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#ma2e31288-mk-arrow)" />
  <text x="144.01" y="102" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.199999999999999">GET /data</text>
</g>

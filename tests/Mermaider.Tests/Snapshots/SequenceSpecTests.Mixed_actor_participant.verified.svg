  <text x="74.00999999999999" y="378" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text-muted)" dy="4.8999999999999995">User</text>
</g>
<g class="actor-ghost" data-id="API" data-label="API" data-type="participant">
  <rect x="174.01" y="358" width="80" height="40" rx="8" ry="8" fill="var(--bg)" stroke="var(--_line-soft)" stroke-width="1.25" />
  <text x="214.01" y="378" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text-muted)" dy="4.8999999999999995">API</text>

</g>
<g class="message" data-from="DB" data-to="API" data-label="rows" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="354.01" y1="214" x2="214.01" y2="214" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ma2e31288-mk-arrow)" />
  <text x="284.01" y="202" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.199999999999999">rows</text>
</g>

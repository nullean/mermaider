<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 661.564 432" width="661.564" height="432" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<g class="diagram-title">
  <rect x="40" y="35.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="56" y="40" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">CI Pipeline Outcomes</text>
</g>
<g class="pie-slice" data-label="Success">
  <path d="M 232 240 L 232 112 A 128 128 0 1 1 130.31 162.26 Z" fill="url(#md68a0f86-pie-d0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" stroke-linejoin="round" />
</g>
<g class="pie-slice" data-label="Failed">
  <path d="M 232 240 L 130.31 162.26 A 128 128 0 0 1 199.31 116.24 Z" fill="url(#md68a0f86-pie-d1)" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" stroke-linejoin="round" />
</g>
<g class="pie-slice" data-label="Cancelled">
  <path d="M 232 240 L 199.31 116.24 A 128 128 0 0 1 232 112 Z" fill="url(#md68a0f86-pie-d2)" stroke="color-mix(in srgb, #e15759 74%, var(--fg))" stroke-width="1.25" stroke-linejoin="round" />
</g>
<path d="M 290.05 357.44 L 294.92 367.3" fill="none" stroke="var(--_line)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
<text x="300.24" y="378.06" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)" dy="4.9">85.39%</text>
<path d="M 159.32 131.01 L 153.21 121.86" fill="none" stroke="var(--_line)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
<text x="146.56" y="111.88" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)" dy="4.9">10.5%</text>
<path d="M 215.13 110.09 L 213.72 99.18" fill="none" stroke="var(--_line)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
<text x="212.17" y="87.28" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="var(--_text)" dy="4.9">4.11%</text>
<rect x="472" y="207" width="10" height="10" rx="3" ry="3" fill="#4e79a7" stroke="none" />
  <text x="490" y="212" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Success</text>
  <text x="557.56" y="212" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">187 · 85.39%</text>
<rect x="472" y="235" width="10" height="10" rx="3" ry="3" fill="#f28e2b" stroke="none" />
  <text x="490" y="240" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Failed</text>
  <text x="540" y="240" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">23 · 10.5%</text>
<rect x="472" y="263" width="10" height="10" rx="3" ry="3" fill="#e15759" stroke="none" />
  <text x="490" y="268" text-anchor="start" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Cancelled</text>
  <text x="563.94" y="268" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">9 · 4.11%</text>
<defs>
  <radialGradient id="md68a0f86-pie-d0" gradientUnits="userSpaceOnUse" cx="232" cy="240" r="128"><stop offset="0" stop-color="color-mix(in srgb, #4e79a7 72%, var(--bg))" /><stop offset="1" stop-color="#4e79a7" /></radialGradient>
  <radialGradient id="md68a0f86-pie-d1" gradientUnits="userSpaceOnUse" cx="232" cy="240" r="128"><stop offset="0" stop-color="color-mix(in srgb, #f28e2b 72%, var(--bg))" /><stop offset="1" stop-color="#f28e2b" /></radialGradient>
  <radialGradient id="md68a0f86-pie-d2" gradientUnits="userSpaceOnUse" cx="232" cy="240" r="128"><stop offset="0" stop-color="color-mix(in srgb, #e15759 72%, var(--bg))" /><stop offset="1" stop-color="#e15759" /></radialGradient>
</defs>
</svg>
  <text class="mono" x="101.65" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">double</text><text class="mono" x="165.05" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">radius</tspan></text>
  <text class="mono" x="101.65" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">double</text><text class="mono" x="165.05" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">area()</tspan></text>
  <text class="mono" x="101.65" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="165.05" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="#3B5B7D" font-weight="700">+ </tspan><tspan fill="var(--_text)">draw()</tspan></text>
  <rect x="93.65" y="40" width="154.60000000000002" height="108" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 273 332" width="273" height="332" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="cls-inherit" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
  <marker id="cls-composition" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
  <marker id="cls-aggregation" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
  <marker id="cls-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
  <marker id="cls-lollipop" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse">
    <circle cx="6" cy="6" r="5" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
</defs>

<path class="class-relationship" data-from="Circle" data-to="Shape" data-type="realization" data-marker-at="to" d="M138.06666666666666,148 L138.06666666666666,172 Q138.06666666666666,178 132.06666666666666,178 L117.2,178 Q111.2,178 111.2,184 L111.2,208" fill="none" stroke="var(--_line)" stroke-width="2.25" stroke-dasharray="6 4" marker-end="url(#cls-inherit)" />
<path class="class-relationship" data-from="Circle" data-to="Drawable" data-type="lollipop" data-marker-at="to" d="M185.53333333333336,148 L185.53333333333336,172 Q185.53333333333336,178 191.53333333333336,178 L206.40000000000003,178 Q212.40000000000003,178 212.40000000000003,184 L212.40000000000003,208" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<g class="class-node" data-id="Shape" data-label="Shape" data-annotation="interface">
  <rect x="40" y="208" width="142.4" height="84" rx="6" ry="6" fill="var(--_node-fill)" stroke="none" />
  <rect x="40" y="208" width="142.4" height="48" rx="6" ry="6" fill="var(--_group-hdr)" stroke="none" />
  <rect x="40" y="214" width="142.4" height="42" fill="var(--_group-hdr)" stroke="none" />
  <text x="111.2" y="220" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="500" font-style="italic" fill="var(--_text-muted)">&lt;&lt;interface&gt;&gt;</text>
  <text x="111.2" y="238" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Shape</text>
  <line x1="40" y1="256" x2="182.4" y2="256" stroke="var(--_line)" stroke-width="1.5" />
  <line x1="40" y1="264" x2="182.4" y2="264" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="48" y="278" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">area()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">double</tspan></text>
  <rect x="40" y="208" width="142.4" height="84" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
<g class="class-node lollipop" data-id="Drawable">
  <circle cx="212.40000000000003" cy="218" r="8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
  <text x="212.40000000000003" y="240" text-anchor="middle" dy="0.35em" font-size="16" font-weight="500" fill="var(--_text)">Drawable</text>
</g>

<g class="class-node" data-id="Circle" data-label="Circle">
  <rect x="90.60000000000001" y="40" width="142.4" height="108" rx="6" ry="6" fill="var(--_node-fill)" stroke="none" />
  <rect x="90.60000000000001" y="40" width="142.4" height="32" rx="6" ry="6" fill="var(--_group-hdr)" stroke="none" />
  <rect x="90.60000000000001" y="46" width="142.4" height="26" fill="var(--_group-hdr)" stroke="none" />
  <text x="161.8" y="56" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Circle</text>
  <line x1="90.60000000000001" y1="72" x2="233" y2="72" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="98.60000000000001" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">radius</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">double</tspan></text>
  <line x1="90.60000000000001" y1="100" x2="233" y2="100" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="98.60000000000001" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">area()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">double</tspan></text>
  <text class="mono" x="98.60000000000001" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">draw()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="90.60000000000001" y="40" width="142.4" height="108" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
</svg>
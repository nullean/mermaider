<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 289.75 332" width="289.75" height="332" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="cls-inherit" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-composition" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <marker id="cls-aggregation" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="6 0, 12 6, 6 12, 0 6" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_line)" stroke-width="2" />
  </marker>
  <marker id="cls-lollipop" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse">
    <circle cx="6" cy="6" r="5" fill="var(--bg)" stroke="var(--_line)" stroke-width="2" />
  </marker>
</defs>

<path class="class-relationship" data-from="Circle" data-to="Shape" data-type="realization" data-marker-at="to" d="M145.88333333333333,148 L145.88333333333333,172 Q145.88333333333333,178 139.88333333333333,178 L123.9,178 Q117.9,178 117.9,184 L117.9,208" fill="none" stroke="var(--_line)" stroke-width="2.25" stroke-dasharray="4 4" marker-end="url(#cls-inherit)" />
<path class="class-relationship" data-from="Circle" data-to="Drawable" data-type="lollipop" data-marker-at="to" d="M197.81666666666666,148 L197.81666666666666,172 Q197.81666666666666,178 203.81666666666666,178 L219.8,178 Q225.8,178 225.8,184 L225.8,208" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<g class="class-node" data-id="Shape" data-label="Shape" data-annotation="interface">
  <rect x="40" y="208" width="155.8" height="84" rx="6" ry="6" fill="var(--bg)" />
  <path d="M40,256 L40,214 Q40,208 46,208 L189.8,208 Q195.8,208 195.8,214 L195.8,256 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="117.9" y="220" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="500" font-style="italic" fill="var(--_text-sec)">&lt;&lt;interface&gt;&gt;</text>
  <text x="117.9" y="238" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Shape</text>
  <line x1="40" y1="256" x2="195.8" y2="256" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="40" y1="264" x2="195.8" y2="264" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="103.4" y1="256" x2="103.4" y2="292" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="48" y="278" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">double</text><text class="mono" x="111.4" y="278" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">area()</tspan></text><text class="mono" x="187.8" y="278" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <rect x="40" y="208" width="155.8" height="84" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node lollipop" data-id="Drawable">
  <circle cx="225.8" cy="218" r="8" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="225.8" y="240" text-anchor="middle" dy="0.35em" font-size="16" font-weight="500" fill="var(--_text)">Drawable</text>
</g>

<g class="class-node" data-id="Circle" data-label="Circle">
  <rect x="93.95" y="40" width="155.8" height="108" rx="6" ry="6" fill="var(--bg)" />
  <path d="M93.95,72 L93.95,46 Q93.95,40 99.95,40 L243.75,40 Q249.75,40 249.75,46 L249.75,72 Z" fill="color-mix(in srgb, #4e79a7 24%, var(--bg))" />
  <text x="171.85000000000002" y="56" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">Circle</text>
  <line x1="93.95" y1="72" x2="249.75" y2="72" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="93.95" y1="124" x2="249.75" y2="124" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <line x1="93.95" y1="100" x2="249.75" y2="100" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="157.35" y1="72" x2="157.35" y2="148" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="101.95" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">double</text><text class="mono" x="165.35" y="86" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">radius</tspan></text><text class="mono" x="241.75" y="86" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <text class="mono" x="101.95" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">double</text><text class="mono" x="165.35" y="114" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">area()</tspan></text><text class="mono" x="241.75" y="114" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <text class="mono" x="101.95" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--_text-sec)">void</text><text class="mono" x="165.35" y="134" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text)">draw()</tspan></text><text class="mono" x="241.75" y="134" text-anchor="end" dy="0.35em" font-size="var(--fs-s)" font-weight="700" fill="#3B5B7D">+</text>
  <rect x="93.95" y="40" width="155.8" height="108" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
</svg>
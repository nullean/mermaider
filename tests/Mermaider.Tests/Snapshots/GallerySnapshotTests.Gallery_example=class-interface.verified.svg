  <text x="328" y="70" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">ILogger</text>
  <line x1="198" y1="88" x2="458" y2="88" stroke="var(--_line)" stroke-width="1.5" />
  <line x1="198" y1="96" x2="458" y2="96" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="206" y="110" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">Log(string message)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <text class="mono" x="206" y="130" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">LogError(Exception ex)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="198" y="40" width="260" height="104" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
<g class="class-node" data-id="ConsoleLogger" data-label="ConsoleLogger">
  <rect x="40" y="204" width="260" height="108" rx="6" ry="6" fill="var(--_node-fill)" stroke="none" />
  <rect x="40" y="204" width="260" height="32" rx="6" ry="6" fill="var(--_group-hdr)" stroke="none" />
  <rect x="40" y="210" width="260" height="26" fill="var(--_group-hdr)" stroke="none" />

  <text x="318" y="70" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">ILogger</text>
  <line x1="184" y1="88" x2="452" y2="88" stroke="#3B5B7D" stroke-width="1.75" />
  <line x1="184" y1="96" x2="452" y2="96" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="192" y="110" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">Log(string message)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <text class="mono" x="192" y="130" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">LogError(Exception ex)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="184" y="40" width="268" height="104" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>

  <text class="mono" x="48" y="250" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">- </tspan><tspan fill="var(--_text-sec)">_verbose</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">bool</tspan></text>
  <line x1="40" y1="264" x2="300" y2="264" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="48" y="278" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">Log(string message)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <text class="mono" x="48" y="298" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">LogError(Exception ex)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="40" y="204" width="260" height="108" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
<g class="class-node" data-id="FileLogger" data-label="FileLogger">
  <rect x="356" y="204" width="260" height="128" rx="6" ry="6" fill="var(--_node-fill)" stroke="none" />
  <rect x="356" y="204" width="260" height="32" rx="6" ry="6" fill="var(--_group-hdr)" stroke="none" />
  <rect x="356" y="210" width="260" height="26" fill="var(--_group-hdr)" stroke="none" />
  <text x="486" y="220" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">FileLogger</text>
  <line x1="356" y1="236" x2="616" y2="236" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="364" y="250" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">- </tspan><tspan fill="var(--_text-sec)">_path</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">string</tspan></text>
  <line x1="356" y1="264" x2="616" y2="264" stroke="var(--_line)" stroke-width="1.5" />

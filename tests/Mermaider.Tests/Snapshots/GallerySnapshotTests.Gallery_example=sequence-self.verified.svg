<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405.61600000000004 460" width="405.61600000000004" height="460" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="seq-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
</defs>

<line class="lifeline" data-actor="A" x1="76.384" y1="70" x2="76.384" y2="430" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="216.38400000000001" y1="70" x2="216.38400000000001" y2="430" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="A" data-to="A" data-label="Initialize" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="76.384,100 106.384,100 106.384,120 76.384,120" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#seq-arrow)" />
  <text x="114.384" y="110" font-size="var(--fs-s)" text-anchor="start" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Initialize</text>
</g>
<g class="message" data-from="A" data-to="B" data-label="Send message" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.384" y1="180" x2="216.38400000000001" y2="180" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#seq-arrow)" />
  <text x="146.38400000000001" y="166" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Send message</text>
</g>
<g class="message" data-from="B" data-to="B" data-label="Process internally" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="216.38400000000001,230 246.38400000000001,230 246.38400000000001,250 216.38400000000001,250" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#seq-arrow)" />
  <text x="254.38400000000001" y="240" font-size="var(--fs-s)" text-anchor="start" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Process internally</text>
</g>
<g class="message" data-from="B" data-to="A" data-label="Acknowledgement" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.38400000000001" y1="310" x2="76.384" y2="310" stroke="var(--_line)" stroke-width="2.25" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="146.38400000000001" y="296" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Acknowledgement</text>
</g>
<g class="actor" data-id="A" data-label="Service" data-type="participant">
  <rect x="30" y="30" width="92.768" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="76.384" y="50" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Service</text>
</g>
<g class="actor" data-id="B" data-label="Queue" data-type="participant">
  <rect x="175.472" y="30" width="81.824" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="216.38400000000001" y="50" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Queue</text>
</g>
<g class="actor" data-id="A" data-label="Service" data-type="participant">
  <rect x="30" y="390" width="92.768" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="76.384" y="410" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Service</text>
</g>
<g class="actor" data-id="B" data-label="Queue" data-type="participant">
  <rect x="175.472" y="390" width="81.824" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="216.38400000000001" y="410" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Queue</text>
</g>
</svg>
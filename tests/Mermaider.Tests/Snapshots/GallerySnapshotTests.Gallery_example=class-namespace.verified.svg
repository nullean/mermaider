  <text class="mono" x="192.2" y="350" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">id</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">int</tspan></text>
  <line x1="184.2" y1="364" x2="326.2" y2="364" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="192.2" y="378" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">place()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
  <rect x="184.2" y="304" width="142" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />

  <line x1="184.2" y1="484" x2="326.2" y2="484" stroke="#3B5B7D" stroke-width="1.75" />
  <text class="mono" x="192.2" y="498" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">name</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">String</tspan></text>
  <text class="mono" x="192.2" y="518" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">price</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">double</tspan></text>
  <line x1="184.2" y1="532" x2="326.2" y2="532" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <rect x="184.2" y="452" width="142" height="88" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>
<g class="class-node" data-id="OrderRepo" data-label="OrderRepo">

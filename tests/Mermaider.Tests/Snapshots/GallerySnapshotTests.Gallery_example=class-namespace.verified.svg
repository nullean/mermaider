  <text class="mono" x="251.59999999999997" y="266" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">id</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">int</tspan></text>
  <line x1="243.59999999999997" y1="280" x2="377.59999999999997" y2="280" stroke="var(--_line)" stroke-width="1.5" />

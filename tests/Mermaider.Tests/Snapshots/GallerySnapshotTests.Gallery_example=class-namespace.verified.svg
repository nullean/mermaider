  <text class="mono" x="263.59999999999997" y="382" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">price</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">double</tspan></text>
  <line x1="255.59999999999997" y1="396" x2="397.59999999999997" y2="396" stroke="var(--_line)" stroke-width="1.5" />
  <rect x="255.59999999999997" y="316" width="142" height="88" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />

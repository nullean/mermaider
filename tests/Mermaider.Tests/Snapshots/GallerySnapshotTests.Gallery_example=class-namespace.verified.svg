  <text x="355" y="112" text-anchor="middle" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)" dy="5.6">ProductRepo</text>
  <line x1="279.6" y1="128" x2="430.4" y2="128" stroke="var(--_line)" stroke-width="1.5" />
  <line x1="279.6" y1="136" x2="430.4" y2="136" stroke="var(--_line)" stroke-width="1.5" />
  <text class="mono" x="287.6" y="150" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">findAll()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">List</tspan></text>
  <rect x="279.6" y="96" width="150.79999999999998" height="68" rx="6" ry="6" fill="none" stroke="var(--_node-stroke)" stroke-width="1.75" />
</g>
</svg>
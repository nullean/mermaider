  <line x1="287.6" y1="136" x2="446.4" y2="136" stroke="#3B5B7D" stroke-width="1" opacity="0.35" />
  <text class="mono" x="295.6" y="150" dy="0.35em" font-size="var(--fs-s)" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">findAll()</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">List</tspan></text>
  <rect x="287.6" y="96" width="158.79999999999998" height="68" rx="6" ry="6" fill="none" stroke="#3B5B7D" stroke-width="1.75" />
</g>

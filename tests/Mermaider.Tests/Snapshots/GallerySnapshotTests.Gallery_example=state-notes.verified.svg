<path class="edge" data-from="Active" data-to="Done" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="finish" d="M123.5,213.7 L123.5,270 Q123.5,276 129.5,276 L233.5,276 Q239.5,276 239.5,282 L239.5,318.6" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

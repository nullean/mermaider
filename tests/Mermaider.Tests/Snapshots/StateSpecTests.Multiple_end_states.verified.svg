  <rect x="74.20759999999999" y="277.29" width="84.58480000000002" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="116.5" y="289.51500000000004" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">reactivate</text>
</g>
<g class="edge-label" data-from="Inactive" data-to="Closed" data-label="close">
  <rect x="69.63207999999999" y="392.725" width="55.73584000000002" height="24.45" rx="10" ry="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="2.25" />
  <text x="97.5" y="404.95000000000005" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">close</text>
</g>

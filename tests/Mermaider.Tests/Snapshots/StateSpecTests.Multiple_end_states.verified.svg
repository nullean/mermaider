<path class="edge" data-from="Inactive" data-to="Active" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="reactivate" d="M116.5,318.6 L116.5,241.5 Q116.5,235.5 110.5,235.5 L103.5,235.5 Q97.5,235.5 97.5,229.5 L97.5,213.7" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />
<path class="edge" data-from="Inactive" data-to="Closed" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="close" d="M97.5,363.40000000000003 L97.5,440.5 Q97.5,446.5 103.5,446.5 L109.5,446.5 Q115.5,446.5 115.5,452.5 L115.5,468.3" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#arrowhead)" />

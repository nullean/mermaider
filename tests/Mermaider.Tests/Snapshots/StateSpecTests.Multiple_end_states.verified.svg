  <rect x="42.736000000000004" y="468.3" width="109.472" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="97.47200000000001" y="490.7" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Closed</text>
</g>

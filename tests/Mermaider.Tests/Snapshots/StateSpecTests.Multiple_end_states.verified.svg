  <rect x="16" y="262.6" width="114.94399999999999" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="73.472" y="285" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Inactive</text>
</g>
<g class="node" data-id="Closed" data-label="Closed" data-shape="rounded">
  <rect x="18.736000000000004" y="396.29999999999995" width="109.472" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="73.47200000000001" y="418.69999999999993" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Closed</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="stateend">
  <circle cx="73.472" cy="542" r="10" fill="none" stroke="var(--_text)" stroke-width="4" />
<circle cx="73.472" cy="542" r="6" fill="var(--_text)" stroke="none" />
  
</g>
</svg>
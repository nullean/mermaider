<rect x="200" y="24" width="168.28" height="36" rx="8" ry="8" fill="var(--_group-hdr)" />
<rect x="200" y="52" width="168.28" height="8" fill="var(--_group-hdr)" />
<line x1="200" y1="60" x2="368.28" y2="60" stroke="var(--_group-stroke)" stroke-width="1" />
<text x="212" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)">In Progress</text>
<rect x="337.6" y="33" width="18.68" height="18" rx="7" ry="7" fill="var(--_key-badge)" />
<text x="346.94" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="var(--_text-sec)">1</text>
</g>
<g class="kanban-card">
<rect x="212" y="72" width="144.28" height="34" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
<text x="224" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Task3</text>
</g>
<g class="kanban-column">
<rect x="384.28" y="24" width="160" height="138" rx="8" ry="8" fill="var(--_group-fill)" stroke="var(--_group-stroke)" stroke-width="1.75" />
<rect x="384.28" y="24" width="160" height="36" rx="8" ry="8" fill="var(--_group-hdr)" />
<rect x="384.28" y="52" width="160" height="8" fill="var(--_group-hdr)" />
<line x1="384.28" y1="60" x2="544.28" y2="60" stroke="var(--_group-stroke)" stroke-width="1" />
<text x="396.28" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)">Done</text>
<rect x="513.6" y="33" width="18.68" height="18" rx="7" ry="7" fill="var(--_key-badge)" />
<text x="522.94" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="var(--_text-sec)">1</text>
</g>
<g class="kanban-card">
<rect x="396.28" y="72" width="136" height="34" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
<text x="408.28" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Task4</text>
</g>
</svg>
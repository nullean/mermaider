<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568.28 186" width="568.28" height="186" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
</defs>

<g class="kanban-column">
<rect x="24" y="24" width="160" height="138" rx="8" ry="8" fill="var(--_group-fill)" stroke="var(--_group-stroke)" stroke-width="1.75" />
<rect x="24" y="24" width="160" height="36" rx="8" ry="8" fill="var(--_group-hdr)" />
<rect x="24" y="52" width="160" height="8" fill="var(--_group-hdr)" />
<line x1="24" y1="60" x2="184" y2="60" stroke="var(--_group-stroke)" stroke-width="1" />
<text x="36" y="42" text-anchor="start" dy="0.35em" font-size="var(--fs-m)" font-weight="700" fill="var(--_text)">Todo</text>
<rect x="149" y="33" width="23" height="18" rx="7" ry="7" fill="var(--_key-badge)" />
<text x="160.5" y="42" text-anchor="middle" dy="0.35em" font-size="var(--fs-xs)" font-weight="600" fill="var(--_text-sec)">2</text>
</g>
<g class="kanban-card">
<rect x="36" y="72" width="136" height="34" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
<text x="48" y="93.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Task1</text>
</g>
<g class="kanban-card">
<rect x="36" y="116" width="136" height="34" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
<text x="48" y="137.9" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)">Task2</text>
</g>
<g class="kanban-column">

  <rect x="50.03200000000001" y="220.8" width="111.29599999999999" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="105.68" y="243.20000000000002" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Review</text>
</g>
<g class="node" data-id="Published" data-label="Published" data-shape="rounded">
  <rect x="40" y="321.6" width="131.36" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="105.68" y="344" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Published</text>
</g>
<g class="node" data-id="Archived" data-label="Archived" data-shape="rounded">
  <rect x="42.736000000000004" y="422.40000000000003" width="125.888" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="105.68" y="444.8" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Archived</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="stateend">
  <circle cx="105.68" cy="519.2" r="10" fill="none" stroke="var(--_text)" stroke-width="4" />
<circle cx="105.68" cy="519.2" r="6" fill="var(--_text)" stroke="none" />
  
</g>
</svg>
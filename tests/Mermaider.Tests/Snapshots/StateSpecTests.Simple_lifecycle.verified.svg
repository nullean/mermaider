  <rect x="72.926" y="278.5" width="65.50800000000001" height="30.2" rx="10" ry="10" fill="var(--bg)" stroke="none" />
<text x="105.68" y="293.6" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">approve</text>
</g>
<g class="edge-label" data-from="Review" data-to="Draft" data-label="reject">
  <rect x="71.242" y="205.9" width="48.876000000000005" height="30.2" rx="10" ry="10" fill="var(--bg)" stroke="none" />
<text x="95.68" y="221" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">reject</text>
</g>
<g class="edge-label" data-from="Published" data-to="Archived" data-label="archive">
  <rect x="75.194" y="379.3" width="60.972" height="30.2" rx="10" ry="10" fill="var(--bg)" stroke="none" />
<text x="105.68" y="394.40000000000003" text-anchor="middle" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">archive</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="statestart">
  <circle cx="105.68" cy="68" r="10" fill="var(--_text)" stroke="none" />
  
</g>
<g class="node" data-id="Draft" data-label="Draft" data-shape="rounded">
  <rect x="59.152000000000015" y="120" width="93.056" height="44.8" rx="10" ry="10" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="105.68" y="142.4" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Draft</text>
</g>

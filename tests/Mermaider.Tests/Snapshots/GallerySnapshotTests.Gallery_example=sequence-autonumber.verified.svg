  <rect x="111.606" y="439.2" width="56.788" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="140" y="450" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">200 OK</text>
</g>
<g class="actor" data-id="Client" data-label="Client" data-type="participant">

  <g class="autonumber"><circle cx="70" cy="314" r="9" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" /><text x="70" y="314" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--bg)" dy="4.2">5</text></g>
  <rect x="98.952" y="289.2" width="82.096" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="140" y="300" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">GET /profile</text>
</g>
<g class="message" data-from="API" data-to="DB" data-label="6. Fetch profile" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="364" x2="350" y2="364" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#md68a0f86-mk-arrow)" />
  <g class="autonumber"><circle cx="210" cy="364" r="9" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" /><text x="210" y="364" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--bg)" dy="4.2">6</text></g>
  <rect x="237.24200000000002" y="339.2" width="85.51599999999999" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="280" y="350" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Fetch profile</text>
</g>
<g class="message" data-from="DB" data-to="API" data-label="7. Profile data" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="414" x2="210" y2="414" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#md68a0f86-mk-arrow)" />
  <g class="autonumber"><circle cx="350" cy="414" r="9" fill="var(--accent, var(--fg))" stroke="var(--bg)" stroke-width="1.5" /><text x="350" y="414" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--bg)" dy="4.2">7</text></g>
  <rect x="240.662" y="389.2" width="78.676" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="280" y="400" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Profile data</text>
</g>
<g class="message" data-from="API" data-to="Client" data-label="8. 200 OK" data-line-style="dashed" data-arrow-head="filled" data-self="false">

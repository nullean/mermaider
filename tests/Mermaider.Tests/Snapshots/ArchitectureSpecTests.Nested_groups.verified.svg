<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 320" width="484" height="320" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px rgba(24,24,27,.10)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(24,24,27,.06)); }
</style>

<g class="architecture-group" data-id="outer">
  <rect x="24" y="24" width="436" height="272" rx="12" ry="12" fill="url(#ma2e31288-cw-p1-0)" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1" />
  <path d="M24,52 L24,36 Q24,24 36,24 L448,24 Q460,24 460,36 L460,52 Z" fill="color-mix(in srgb, #f28e2b 22%, var(--bg))" />
  <line x1="24" y1="52" x2="460" y2="52" stroke="color-mix(in srgb, #f28e2b 42%, var(--bg))" stroke-width="1" />
</g>
<g class="architecture-group" data-id="inner">
  <rect x="52" y="86" width="176" height="182" rx="12" ry="12" fill="url(#ma2e31288-cw-p2-1)" stroke="color-mix(in srgb, #76b7b2 42%, var(--bg))" stroke-width="1" />
  <path d="M52,114 L52,98 Q52,86 64,86 L216,86 Q228,86 228,98 L228,114 Z" fill="color-mix(in srgb, #76b7b2 22%, var(--bg))" />
  <line x1="52" y1="114" x2="228" y2="114" stroke="color-mix(in srgb, #76b7b2 42%, var(--bg))" stroke-width="1" />
</g>
<path class="architecture-edge" data-source="a" data-target="b" d="M200,194 L312,194" fill="none" stroke="var(--_line)" stroke-width="1.5" />
<circle class="architecture-port" cx="200" cy="194" r="3" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
<circle class="architecture-port" cx="312" cy="194" r="3" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
<g class="architecture-group-title" data-id="outer">
<rect x="34" y="32" width="3" height="12" rx="1.5" ry="1.5" fill="var(--accent, var(--fg))" />
<g transform="translate(53 38) scale(0.818)" fill="none" stroke="color-mix(in srgb, #f28e2b 44%, var(--fg))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-7 4.5 C-11 4.5 -11 -1.5 -6 -1.5 C-6 -6.5 3 -7.5 4 -1.5 C10 -2.5 11 4.5 6 4.5Z" /></g>
<text x="68" y="38" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #f28e2b 44%, var(--fg))" dy="4.8999999999999995">Outer</text>
</g>
<g class="architecture-group-title" data-id="inner">
<rect x="62" y="94" width="3" height="12" rx="1.5" ry="1.5" fill="var(--accent, var(--fg))" />
<g transform="translate(81 100) scale(0.818)" fill="none" stroke="color-mix(in srgb, #76b7b2 44%, var(--fg))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-7 4.5 C-11 4.5 -11 -1.5 -6 -1.5 C-6 -6.5 3 -7.5 4 -1.5 C10 -2.5 11 4.5 6 4.5Z" /></g>
<text x="96" y="100" text-anchor="start" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #76b7b2 44%, var(--fg))" dy="4.8999999999999995">Inner</text>
</g>
<g class="architecture-service" data-id="a" data-icon="server">
  <rect x="80" y="148" width="120" height="92" rx="12" ry="12" fill="url(#ma2e31288-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <g transform="translate(140 180) scale(1.182)" fill="none" stroke="color-mix(in srgb, #4e79a7 44%, var(--fg))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-9" width="20" height="7" rx="2" /><rect x="-10" y="2" width="20" height="7" rx="2" /><path d="M-5 -5.5 H-4 M-5 5.5 H-4" /></g>
  <text x="140" y="220" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">A</text>
</g>
<g class="architecture-service" data-id="b" data-icon="server">
  <rect x="312" y="148" width="120" height="92" rx="12" ry="12" fill="url(#ma2e31288-ng-p0)" stroke="color-mix(in srgb, #4e79a7 74%, var(--fg))" stroke-width="1.25" />
  <g transform="translate(372 180) scale(1.182)" fill="none" stroke="color-mix(in srgb, #4e79a7 44%, var(--fg))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-9" width="20" height="7" rx="2" /><rect x="-10" y="2" width="20" height="7" rx="2" /><path d="M-5 -5.5 H-4 M-5 5.5 H-4" /></g>
  <text x="372" y="220" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.8999999999999995">B</text>
</g>
<defs>
  <linearGradient id="ma2e31288-cw-p1-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg))" /><stop offset="0.55" stop-color="color-mix(in srgb, #f28e2b 6%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #f28e2b 6%, var(--bg))" /></linearGradient>
  <linearGradient id="ma2e31288-cw-p2-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg))" /><stop offset="0.55" stop-color="color-mix(in srgb, #76b7b2 9%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #76b7b2 9%, var(--bg))" /></linearGradient>
  <linearGradient id="ma2e31288-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #4e79a7 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #4e79a7 7%, var(--bg))" /></linearGradient>
</defs>
</svg>
  <rect x="125.344" y="201.6" width="69.344" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #e15759 16%, var(--bg))" stroke="#D52629" stroke-width="2" />
  <text x="160.016" y="224" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">F</text>
</g>
</svg>
  <rect x="125.344" y="108.8" width="69.344" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #f28e2b 16%, var(--bg))" stroke="#D36F0D" stroke-width="2" />
  <text x="160.016" y="131.2" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">D</text>
</g>
<g class="node" data-id="E" data-label="E" data-shape="rectangle">
  <rect x="16" y="201.6" width="69.344" height="44.8" rx="6" ry="6" fill="color-mix(in srgb, #e15759 16%, var(--bg))" stroke="#D52629" stroke-width="2" />
  <text x="50.672" y="224" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">E</text>
</g>

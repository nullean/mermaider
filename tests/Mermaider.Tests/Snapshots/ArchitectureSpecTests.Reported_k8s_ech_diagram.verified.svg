    <image x="36" y="36" width="20" height="20" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+CjxwYXRoIGQ9Ik03IDE4YTQgNCAwIDAgMS0uNS03Ljk3QTUgNSAwIDAgMSAxNiA4LjVhNC41IDQuNSAwIDAgMSAxIDguOVYxOEg3eiIgZmlsbD0iIzY0NzQ4YiIvPgo8L3N2Zz4=" />
<text x="64" y="46" font-size="var(--fs-s)" font-weight="600" fill="#6FB3AE" dy="4.8999999999999995">ECH</text>
</g>
<path class="architecture-edge" data-source="edot" data-target="otlp" d="M628,126 L482,126" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="otlp" data-target="apm" d="M470,126 L290,126 Q284,126 284,120 L284,86" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="oteldemo" data-target="edot" d="M820,126 L708,126" fill="none" stroke="var(--_line)" stroke-width="2.25" />

    <image x="612" y="36" width="20" height="20" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+CjxwYXRoIGQ9Ik03IDE4YTQgNCAwIDAgMS0uNS03Ljk3QTUgNSAwIDAgMSAxNiA4LjVhNC41IDQuNSAwIDAgMSAxIDguOVYxOEg3eiIgZmlsbD0iIzY0NzQ4YiIvPgo8L3N2Zz4=" />

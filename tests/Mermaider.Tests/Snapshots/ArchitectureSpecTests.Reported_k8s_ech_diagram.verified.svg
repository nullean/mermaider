  <image x="262" y="296" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="284" y="374" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Kibana</text>
</g>
<g class="architecture-service" data-id="apm" data-icon="server">
  <rect x="244" y="86" width="80" height="80" rx="10" ry="10" fill="color-mix(in srgb, #4e79a7 16%, var(--bg))" stroke="#3B5B7D" stroke-width="1.75" />
  <image x="262" y="104" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="284" y="182" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">APM</text>
</g>
<circle class="architecture-junction" data-id="otlp" cx="476" cy="126" r="3" fill="var(--_line)" />
</svg>
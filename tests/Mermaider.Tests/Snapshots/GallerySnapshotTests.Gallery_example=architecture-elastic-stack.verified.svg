<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="arch-arrow-end" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
    <polygon points="0 0, 12 6, 0 12" fill="var(--_line)" />
  </marker>
  <marker id="arch-arrow-start" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
    <polygon points="12 0, 0 6, 12 12" fill="var(--_line)" />
  </marker>
</defs>

<g class="architecture-group" data-id="stack">
  <rect x="24" y="24" width="712" height="372" rx="8" ry="8" fill="color-mix(in srgb, #f28e2b 6%, var(--bg))" stroke="#F18921" stroke-width="1.75" />
    <image x="36" y="36" width="20" height="20" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+CjxwYXRoIGQ9Ik03IDE4YTQgNCAwIDAgMS0uNS03Ljk3QTUgNSAwIDAgMSAxNiA4LjVhNC41IDQuNSAwIDAgMSAxIDguOVYxOEg3eiIgZmlsbD0iIzY0NzQ4YiIvPgo8L3N2Zz4=" />
<text x="64" y="46" font-size="var(--fs-s)" font-weight="600" fill="#F18921" dy="4.8999999999999995">Elastic Stack</text>
</g>
<path class="architecture-edge" data-source="beats" data-target="ls" d="M132,126 L244,126" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="ls" data-target="es" d="M324,126 L436,126" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="es" data-target="kbn" d="M516,126 L628,126" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<path class="architecture-edge" data-source="fleet" data-target="beats" d="M92,278 L92,166" fill="none" stroke="var(--_line)" stroke-width="2.25" />
<g class="architecture-service" data-id="beats" data-icon="elastic:beats">
  <defs><linearGradient id="arch-grad-beats" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd8d3"/><stop offset="1" stop-color="#018f8a"/></linearGradient></defs>
  <rect x="52" y="86" width="80" height="80" rx="10" ry="10" fill="url(#arch-grad-beats)" />
  <image x="70" y="104" width="44" height="44" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+CjxyZWN0IHg9IjQuNSIgeT0iNiIgd2lkdGg9IjE1IiBoZWlnaHQ9IjIuNCIgcng9IjEuMiIgZmlsbD0iI2ZmZmZmZiIvPjxwYXRoIGQ9Ik01IDhoMTRsLTEuMyAxMC4zQTIgMiAwIDAgMSAxNS43IDIwSDguM2EyIDIgMCAwIDEtMi0xLjd6IiBmaWxsPSIjZmZmZmZmIi8+Cjwvc3ZnPg==" />
  <rect x="66.82400000000001" y="171.6" width="50.35199999999999" height="20.8" rx="4" fill="var(--bg)" />
  <text x="92" y="182" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Beats</text>
</g>
<g class="architecture-service" data-id="ls" data-icon="elastic:logstash">
  <defs><linearGradient id="arch-grad-ls" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4547"/><stop offset="1" stop-color="#000000"/></linearGradient></defs>
  <rect x="244" y="86" width="80" height="80" rx="10" ry="10" fill="url(#arch-grad-ls)" />
  <image x="262" y="104" width="44" height="44" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+CjxwYXRoIGQ9Ik01IDVoMTRsLTUgN3Y2bC00IDJ2LTh6IiBmaWxsPSIjZmZmZmZmIi8+Cjwvc3ZnPg==" />
  <text x="284" y="182" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Logstash</text>
</g>
<g class="architecture-service" data-id="es" data-icon="elastic:elasticsearch">
  <defs><linearGradient id="arch-grad-es" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#c99a00"/></linearGradient></defs>
  <rect x="436" y="86" width="80" height="80" rx="10" ry="10" fill="url(#arch-grad-es)" />
  <image x="454" y="104" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="476" y="182" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Elasticsearch</text>
</g>
<g class="architecture-service" data-id="kbn" data-icon="elastic:kibana">
  <defs><linearGradient id="arch-grad-kbn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd8cc"/><stop offset="1" stop-color="#008f86"/></linearGradient></defs>
  <rect x="628" y="86" width="80" height="80" rx="10" ry="10" fill="url(#arch-grad-kbn)" />
  <image x="646" y="104" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="668" y="182" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Kibana</text>
</g>
<g class="architecture-service" data-id="fleet" data-icon="elastic:fleet">
  <defs><linearGradient id="arch-grad-fleet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f78fc0"/><stop offset="1" stop-color="#b8215f"/></linearGradient></defs>
  <rect x="52" y="278" width="80" height="80" rx="10" ry="10" fill="url(#arch-grad-fleet)" />
  <image x="70" y="296" width="44" height="44" href="data:image/svg+xml;base64," />
  <text x="92" y="374" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Fleet</text>
</g>
</svg>
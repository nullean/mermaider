<line class="lifeline" data-actor="API" x1="210" y1="70" x2="210" y2="566" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<line class="lifeline" data-actor="DB" x1="350" y1="70" x2="350" y2="566" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<g class="message" data-from="API" data-to="Client" data-label="Cached" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="160" x2="70" y2="160" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m1814eb8b-mk-arrow)" />
  <rect x="109.896" y="135.2" width="60.208" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="140" y="146" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">Cached</text>
</g>

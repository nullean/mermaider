<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 481.02 560" width="481.02" height="560" style="--bg:#FFFFFF;--fg:#27272A;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
</style>

<defs>
  <marker id="seq-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polygon points="0 0, 12 6, 0 12" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
    <polyline points="0 0, 12 6, 0 12" fill="none" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
</defs>

<g class="block" data-type="loop" data-label="Retry on failure">
  <rect x="310" y="240" width="80" height="60" rx="8" ry="8" fill="none" stroke="var(--_line)" stroke-width="1.75" />
  <rect x="310" y="240" width="46.66" height="18" rx="6" ry="6" fill="var(--_group-hdr)" stroke="var(--_line)" stroke-width="1.75" />
  <text x="316" y="249" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">loop</text>
  <rect x="295.59" y="238" width="108.82000000000002" height="22" rx="4" ry="4" fill="var(--_text)" />
  <text x="350" y="249" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--bg)">Retry on failure</text>
</g>
<g class="block" data-type="alt" data-label="Cache Hit">
  <rect x="30" y="88" width="360" height="342" rx="8" ry="8" fill="none" stroke="var(--_line)" stroke-width="1.75" />
  <rect x="30" y="88" width="33.22" height="18" rx="6" ry="6" fill="var(--_group-hdr)" stroke="var(--_line)" stroke-width="1.75" />
  <text x="36" y="97" font-size="var(--fs-s)" font-weight="600" fill="var(--_text-sec)" dy="4.8999999999999995">alt</text>
  <rect x="172.6" y="86" width="74.80000000000001" height="22" rx="4" ry="4" fill="var(--_text)" />
  <text x="210" y="97" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--bg)">Cache Hit</text>
  <line x1="30" y1="162" x2="390" y2="162" stroke="var(--_line)" stroke-width="1.75" />
  <rect x="165.418" y="165" width="89.164" height="22" rx="4" ry="4" fill="var(--_text)" />
  <text x="210" y="176" text-anchor="middle" dy="0.35em" font-size="var(--fs-s)" font-weight="400" fill="var(--bg)">Cache Miss</text>
</g>
<line class="lifeline" data-actor="Client" x1="70" y1="70" x2="70" y2="530" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="API" x1="210" y1="70" x2="210" y2="530" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DB" x1="350" y1="70" x2="350" y2="530" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="API" data-to="Client" data-label="Cached" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="128" x2="70" y2="128" stroke="var(--_line)" stroke-width="2.25" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="114" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Cached</text>
</g>
<g class="message" data-from="API" data-to="DB" data-label="Query" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="202" x2="350" y2="202" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#seq-arrow)" />
  <text x="280" y="188" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Query</text>
</g>
<g class="message" data-from="DB" data-to="DB" data-label="Process" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="350,280 380,280 380,300 350,300" fill="none" stroke="var(--_line)" stroke-width="2.25" marker-end="url(#seq-arrow)" />
  <text x="388" y="290" font-size="var(--fs-s)" text-anchor="start" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Process</text>
</g>
<g class="message" data-from="DB" data-to="API" data-label="Result" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="360" x2="210" y2="360" stroke="var(--_line)" stroke-width="2.25" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="280" y="346" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Result</text>
</g>
<g class="message" data-from="API" data-to="Client" data-label="Fresh" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="410" x2="70" y2="410" stroke="var(--_line)" stroke-width="2.25" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="396" font-size="var(--fs-s)" text-anchor="middle" font-weight="400" fill="var(--_text)" dy="4.8999999999999995">Fresh</text>
</g>
<g class="actor" data-id="Client" data-label="Client" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="70" y="50" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Client</text>
</g>
<g class="actor" data-id="API" data-label="API" data-type="participant">
  <rect x="170" y="30" width="80" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="210" y="50" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">API</text>
</g>
<g class="actor" data-id="DB" data-label="DB" data-type="participant">
  <rect x="310" y="30" width="80" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="350" y="50" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">DB</text>
</g>
<g class="actor" data-id="Client" data-label="Client" data-type="participant">
  <rect x="30" y="490" width="80" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="70" y="510" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">Client</text>
</g>
<g class="actor" data-id="API" data-label="API" data-type="participant">
  <rect x="170" y="490" width="80" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="210" y="510" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">API</text>
</g>
<g class="actor" data-id="DB" data-label="DB" data-type="participant">
  <rect x="310" y="490" width="80" height="40" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="350" y="510" font-size="var(--fs-m)" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="5.6">DB</text>
</g>
</svg>
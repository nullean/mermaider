<path class="edge" data-from="B" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="No" d="M120.02366666666667,180 L120.02366666666667,200.16 Q120.02366666666667,208.16 128.02366666666666,208.16 L151.394,208.16 Q159.394,208.16 159.394,216.16 L159.394,288.01" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#md68a0f86-mk-arrow)" />

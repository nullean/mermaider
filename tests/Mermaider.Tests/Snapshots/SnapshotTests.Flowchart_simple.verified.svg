</g>
<g class="edge-label" data-from="B" data-to="D" data-label="No">
  <rect x="142.97" y="231.28499999999997" width="32.848" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="159.39" y="242.09" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">No</text>
</g>

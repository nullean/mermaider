  <rect x="40" y="148.8" width="106.73599999999999" height="52.8" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="93.368" y="175.20000000000002" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Middle</text>
</g>
<g class="node" data-id="Top" data-label="Top" data-shape="rectangle">
  <rect x="49.57599999999999" y="40.00000000000003" width="87.584" height="52.8" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="2" />
  <text x="93.368" y="66.40000000000003" text-anchor="middle" font-size="var(--fs-m)" font-weight="500" fill="var(--_text)" dy="5.6">Top</text>
</g>
</svg>
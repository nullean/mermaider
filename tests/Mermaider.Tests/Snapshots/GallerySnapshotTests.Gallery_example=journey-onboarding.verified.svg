<text x="1030" y="75" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600" fill="#539D97">Success</text>
<line x1="230" y1="110" x2="230" y2="485" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 2" />
<circle class="face" cx="230" cy="330" r="15" fill="color-mix(in srgb, #59a14f 24%, var(--bg))" stroke="#42783B" stroke-width="2" />
<circle cx="225" cy="325" r="1.5" fill="var(--_text-muted)" stroke="var(--_text-muted)" />
<circle cx="235" cy="325" r="1.5" fill="var(--_text-muted)" stroke="var(--_text-muted)" />

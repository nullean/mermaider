<rect x="755" y="110" width="150" height="50" rx="6" ry="6" fill="color-mix(in srgb, #f28e2b 16%, var(--bg))" stroke="#D36F0D" stroke-width="1.75" />
<circle cx="769" cy="110" r="7" fill="color-mix(in srgb, #b07aa1 60%, var(--bg))" stroke="#955884" stroke-width="1.5"><title>User</title></circle>
<circle cx="779" cy="110" r="7" fill="color-mix(in srgb, #9c755f 60%, var(--bg))" stroke="#765848" stroke-width="1.5"><title>System</title></circle>

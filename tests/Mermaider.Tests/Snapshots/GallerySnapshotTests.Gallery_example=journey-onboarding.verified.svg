<circle cx="969" cy="110" r="7" fill="color-mix(in srgb, #b07aa1 60%, var(--bg))" stroke="#955884" stroke-width="1.5"><title>User</title></circle>
<text x="1030" y="135" text-anchor="middle" dy="0.35em" font-size="14" fill="var(--_text)">Reach dashboard</text>
<line x1="155" y1="200" x2="1101" y2="200" stroke="var(--_line)" stroke-width="3" marker-end="url(#journey-arrow)" />
</g>
</svg>
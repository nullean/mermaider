name: Build the docs

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Render screenshots
        run: dotnet run scripts/screenshots.cs

      - name: Build documentation
        uses: elastic/docs-builder@main

      - name: Use custom landing page
        run: cp docs/mermaider-landing.html .artifacts/docs/html/index.html

      # docs-builder writes canonical / og:url / og:image against its default host, and the action has no input to
      # change it; point them at this site so links unfurl with the right card.
      - name: Point canonical and social links at this site
        run: grep -rlZ 'https://docs-v3-preview.elastic.dev' .artifacts/docs/html | xargs -0 -r sed -i 's#https://docs-v3-preview.elastic.dev#https://mermaider.nullean.net#g'

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .artifacts/docs/html

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4

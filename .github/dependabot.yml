version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Naiad 2 adds a SponsorCheck build target (SC021) that fails the build unless the repository declares a
      # time-boxed sponsorship exemption; staying on 1.x until that is decided.
      - dependency-name: Naiad
        versions: [">= 2.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # pinned to the commit of its v1 major tag on purpose; dependabot resolves it to an older, differently labelled
      # release that zizmor's online audit then rejects
      - dependency-name: elastic/docs-builder

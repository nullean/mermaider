  <line x1="104" y1="161.6" x2="720" y2="161.6" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="92" y="161.6" text-anchor="end" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">9600</text>
  <line x1="104" y1="92" x2="720" y2="92" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="92" y="92" text-anchor="end" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">11000</text>
  <text x="155.33" y="460" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">jan</text>
  <text x="258" y="460" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">feb</text>
  <text x="360.67" y="460" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">mar</text>
  <text x="463.33" y="460" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">apr</text>
  <text x="566" y="460" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">may</text>
  <text x="668.67" y="460" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">jun</text>
</g>
<g transform="translate(46 266) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Revenue (in $)</text></g>

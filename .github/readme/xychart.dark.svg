  <circle cx="668.667" cy="116.857" r="3.5" fill="#F7BC81" stroke="var(--bg)" stroke-width="1.5" />
</g>
<defs>
  <linearGradient id="mf0d69919-bg-d0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#89A7C8" /><stop offset="1" stop-color="color-mix(in srgb, #89A7C8 62%, var(--bg))" /></linearGradient>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 284" width="300" height="284" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style>

<path class="class-relationship" data-from="Animal" data-to="Dog" data-type="inheritance" data-marker-at="from" d="M125.13333333333333,148 L125.13333333333333,165 Q125.13333333333333,173 117.13333333333333,173 L98,173 Q90,173 90,181 L90,208" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-start="url(#m1814eb8b-mk-triangle-s)" />
<path class="class-relationship" data-from="Animal" data-to="Cat" data-type="inheritance" data-marker-at="from" d="M174.86666666666667,148 L174.86666666666667,165 Q174.86666666666667,173 182.86666666666667,173 L202,173 Q210,173 210,181 L210,208" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-start="url(#m1814eb8b-mk-triangle-s)" />
<g class="class-node" data-id="Animal" data-label="Animal" data-annotation="abstract">
  <rect x="75.4" y="40" width="149.2" height="108" rx="8" ry="8" fill="var(--bg)" stroke="none" />
  <path d="M75.4,92 L75.4,48 Q75.4,40 83.4,40 L216.6,40 Q224.6,40 224.6,48 L224.6,92 Z" fill="url(#m1814eb8b-eb-p6)" />
  <line x1="75.4" y1="92" x2="224.6" y2="92" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1.25" />
  <rect x="75.4" y="40" width="149.2" height="108" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1.25" />
  <line x1="75.4" y1="120" x2="224.6" y2="120" stroke="color-mix(in srgb, #86bcb6 74%, var(--fg))" stroke-width="1.25" />
  <text x="150" y="56.64" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, #86bcb6 44%, var(--fg))" dy="4.2">«abstract»</text>
  <text x="150" y="74.32" text-anchor="middle" font-size="var(--fs-m)" font-weight="600" fill="var(--_text)" dy="5.6">Animal</text>
  <text x="91.4" y="106" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">String</text>
  <text x="208.6" y="106" class="mono" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #86bcb6 44%, var(--fg))" dy="4.9">+</text>
  <text x="146.6" y="106" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">name</text>
  <text x="91.4" y="134" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">void</text>
  <text x="208.6" y="134" class="mono" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #86bcb6 44%, var(--fg))" dy="4.9">+</text>
  <text x="146.6" y="134" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">eat()</text>
</g>
